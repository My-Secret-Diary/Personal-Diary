// timezone helper (India)
function getYMDInTimeZone(timeZone='Asia/Kolkata', d=new Date()){
  const parts = new Intl.DateTimeFormat('en-CA', { timeZone, year:'numeric', month:'2-digit', day:'2-digit' }).formatToParts(d);
  const obj = {}; parts.forEach(p=>obj[p.type]=p.value);
  return `${obj.year}-${obj.month}-${obj.day}`;
}
const toYMD = d => (new Date(d)).toISOString().slice(0,10);

// crypto helpers (PBKDF2 + AES-GCM)
function b64(arr){ return btoa(String.fromCharCode(...arr)); }
function fromB64(s){ return Uint8Array.from(atob(s), c=>c.charCodeAt(0)); }

async function deriveKey(password, salt) {
  const enc = new TextEncoder();
  const base = await crypto.subtle.importKey('raw', enc.encode(password), {name:'PBKDF2'}, false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name:'PBKDF2', salt, iterations:150000, hash:'SHA-256' }, base, { name:'AES-GCM', length:256 }, false, ['encrypt','decrypt']);
}
async function encryptPayload(password, payloadObj){
  const salt = crypto.getRandomValues(new Uint8Array(16));
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const key = await deriveKey(password, salt);
  const enc = new TextEncoder();
  const data = enc.encode(JSON.stringify(payloadObj));
  const cipher = await crypto.subtle.encrypt({ name:'AES-GCM', iv }, key, data);
  return { cipher: b64(new Uint8Array(cipher)), iv: b64(iv), salt: b64(salt) };
}
async function decryptPayload(password, docData){
  const iv = fromB64(docData.iv);
  const salt = fromB64(docData.salt);
  const key = await deriveKey(password, salt);
  const cipherBuf = fromB64(docData.cipher);
  const plain = await crypto.subtle.decrypt({ name:'AES-GCM', iv }, key, cipherBuf);
  return JSON.parse(new TextDecoder().decode(plain));
}

      await setDoc(sRef, { password: storedPassword, name: diaryName, bg: settingsMeta.background || "" });

  } catch(e){
    console.warn('loadSettings error', e);
  }
}

// calendar index for month
async function loadEntriesIndexForMonth(year, month){
  entriesIndex = {};
  const days = new Date(year, month+1, 0).getDate();
  const promises = [];
  for(let d=1; d<=days; d++){
    const key = toYMD(new Date(year, month, d));
    promises.push((async ()=>{
      try{
        const snap = await getDoc(doc(db,'entries', key));
        if(snap.exists()) entriesIndex[key] = true;
      }catch(e){}
    })());
  }
  await Promise.all(promises);
}

// render calendar
function renderCalendar(year, month){
  calendarYear = year; calendarMonth = month;
  const first = new Date(year, month, 1);
  const startWeekday = first.getDay();
  const daysInMonth = new Date(year, month+1, 0).getDate();
  monthLabel.textContent = first.toLocaleString(undefined,{month:'long', year:'numeric'});
  calendarGrid.innerHTML = '';
  for(let i=0;i<startWeekday;i++){ const el=document.createElement('div'); el.className='dayCell disabled'; calendarGrid.appendChild(el); }
  for(let d=1; d<=daysInMonth; d++){
    const dt = new Date(year, month, d);
    const key = toYMD(dt);
    const cell = document.createElement('div');
    cell.className='dayCell';
    cell.textContent = d;
    const dot = document.createElement('div'); dot.className='dot';
    if(entriesIndex[key]) cell.classList.add('hasEntry');
    cell.appendChild(dot);
    const todayKey = getYMDInTimeZone('Asia/Kolkata', new Date());
    if(key === todayKey) cell.classList.add('today');
    cell.onclick = async ()=> { await selectDate(key, dt); };
    if(key === selectedDate) cell.classList.add('selected');
    calendarGrid.appendChild(cell);
  }
}

// UTILITY: wrap a Range with a span + style object
function wrapRangeWithSpan(range, styleObj = {}, className = null){
  if(range.collapsed) return;
  // normalize: extract contents and rewrap with span
  const frag = range.extractContents();
  const wrapper = document.createElement('span');
  if(className) wrapper.className = className;
  for(const k in styleObj) wrapper.style[k] = styleObj[k];
  wrapper.appendChild(frag);
  range.insertNode(wrapper);
  // merge adjacent spans with same styles if desired (optional)
  return wrapper;
}

// UTILITY: unwrap highlight spans inside the selected range (only remove background highlight)
function removeHighlightInRange(range){
  if(range.collapsed) return;
  // create a TreeWalker over nodes inside range
  const common = range.commonAncestorContainer;
  const walker = document.createTreeWalker(common, NodeFilter.SHOW_ELEMENT | NodeFilter.SHOW_TEXT, null, false);
  // Collect affected HL spans that intersect selection
  const toProcess = new Set();
  let n;
  while(n = walker.nextNode()){
    if(n.nodeType !== 1) continue;
    if(n.classList && n.classList.contains('hl')){
      // check intersection with range
      try{
        const r2 = document.createRange();
        r2.selectNodeContents(n);
        if(range.compareBoundaryPoints(Range.END_TO_START, r2) < 0 && range.compareBoundaryPoints(Range.START_TO_END, r2) > 0){
          toProcess.add(n);
        }
      }catch(e){}
    }
  }
  // For each hl span in toProcess, we need to remove only the part inside range.
  // Simplify approach: within range, extractContents, replace hl spans inside extracted frag by their textNodes, then reinsert.
  const extracted = range.extractContents();
  const spanWalker = document.createTreeWalker(extracted, NodeFilter.SHOW_ELEMENT | NodeFilter.SHOW_TEXT, null, false);
  const removeNodes = [];
  while(n = spanWalker.nextNode()){
    if(n.nodeType === 1 && n.classList.contains('hl')){
      // replace the element with its children (unwrap)
      const parent = n.parentNode;
      while(n.firstChild) parent.insertBefore(n.firstChild, n);
      parent.removeChild(n);
    }
  }
  range.insertNode(extracted);
}

// utility: wrap text node/element with given inline style (font, size, color)
function applyInlineStyleToRange(range, styleObj={}, className=null){
  if(range.collapsed) return;
  wrapRangeWithSpan(range, styleObj, className);
}

// utility: unwrap certain tags (b, i, u, strike) and remove inline styles (preserving lists)
function clearFormattingInNode(root){
  // recursively process
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_ELEMENT, null, false);
  const toUnwrap = [];
  const toStyleClear = [];
  while(true){
    const n = walker.nextNode();
    if(!n) break;
    const tag = n.tagName && n.tagName.toLowerCase();
    // skip list containers (ul, ol, li) - don't convert lists to plain
    if(tag === 'ul' || tag === 'ol' || tag === 'li') {
      // only clear inline styles inside li but do not remove the element
      toStyleClear.push(n);
      continue;
    }
    if(tag === 'b' || tag === 'strong' || tag === 'i' || tag === 'em' || tag === 'u' || tag === 's' || tag === 'strike' || tag === 'span' ){
      toUnwrap.push(n);
    } else {
      // other elements: remove font-family/font-size, color, background inline styles
      toStyleClear.push(n);
    }
  }
  // unwrap elements collected (but careful: for span we may want to only remove style attributes)
  toUnwrap.forEach(el=>{
    // if it's a span with meaningful styles, remove specific formatting but keep other attributes
    if(el.tagName.toLowerCase() === 'span'){
      el.style.fontWeight = '';
      el.style.fontStyle = '';
      el.style.textDecoration = '';
      el.style.color = '';
      el.style.background = '';
      el.style.fontFamily = '';
      el.style.fontSize = '';
      // if after clearing it has no attributes and no useful styles and not class, unwrap it to keep DOM clean
      const hasStyles = el.getAttribute('style') && el.getAttribute('style').trim() !== '';
      const hasClass = el.className && el.className.trim() !== '';
      if(!hasStyles && !hasClass){
        // unwrap
        const parent = el.parentNode;
        while(el.firstChild) parent.insertBefore(el.firstChild, el);
        parent.removeChild(el);
      }
    } else {
      // unwrap tags like b/i/u/strong/em/strike -> replace element with its children
      try{
        const parent = el.parentNode;
        while(el.firstChild) parent.insertBefore(el.firstChild, el);
        parent.removeChild(el);
      }catch(e){}
    }
  });
  // remove inline styles from elements collected
  toStyleClear.forEach(el=>{
    // Do not touch list tags themselves (we preserved li/ul/ol), but clear inline style on them's children is handled above
    el.style.fontWeight = '';
    el.style.fontStyle = '';
    el.style.textDecoration = '';
    el.style.color = '';
    el.style.background = '';
    el.style.fontFamily = '';
    el.style.fontSize = '';
    // if it is a .hl span, unwrap it (remove background)
    if(el.classList && el.classList.contains('hl')){
      const parent = el.parentNode;
      while(el.firstChild) parent.insertBefore(el.firstChild, el);
      parent.removeChild(el);
    }
  });
}

// When highlight is turned off, move caret out of highlight span (if caret collapsed inside one)
function moveCaretOutOfHighlight(){
  const sel = window.getSelection();
  if(!sel || !sel.rangeCount) return;
  const range = sel.getRangeAt(0);
  if(!range.collapsed) return; // only needed when caret collapsed
  let node = range.startContainer;
  let ancestor = (node.nodeType === 3) ? node.parentElement : node;
  while(ancestor && ancestor !== editor && ancestor.nodeType === 1){
    if(ancestor.classList && ancestor.classList.contains('hl')){
      const spacer = document.createElement('span');
      spacer.textContent = '\u200B';
      spacer.style.background = 'transparent';
      insertAfter(spacer, ancestor);
      const newRange = document.createRange();
      newRange.setStart(spacer.firstChild, 1);
      newRange.collapse(true);
      sel.removeAllRanges();
      sel.addRange(newRange);
      setTimeout(()=> cleanupZeroWidthSpacers(), 400);
      return;
    }
    ancestor = ancestor.parentElement;
  }
}

// utility: insertAfter
function insertAfter(newNode, referenceNode){
  referenceNode.parentNode.insertBefore(newNode, referenceNode.nextSibling);
}

// cleanup helper: remove stray zero-width space nodes that may remain (keeps caret integrity)
function cleanupZeroWidthSpacers(){
  try{
    const nodes = editor.querySelectorAll('span');
    nodes.forEach(s=>{
      if(s.textContent === '\u200B'){
        // remove if empty and selection not inside it
        const sel = window.getSelection();
        let keep = false;
        if(sel && sel.rangeCount){
          const r = sel.getRangeAt(0);
          if(r.startContainer === s.firstChild) keep = true;
        }
        if(!keep) s.remove();
      }
    });
  }catch(e){}
}

// utility: compare computed background color of element with highlightColor
function cssBackgroundMatchesHighlight(el){
  if(!el || el.nodeType !== 1) return false;
  const tmp = document.createElement('div');
  tmp.style.backgroundColor = highlightColor;
  document.body.appendChild(tmp);
  const desired = getComputedStyle(tmp).backgroundColor;
  document.body.removeChild(tmp);
  const cur = getComputedStyle(el).backgroundColor;
  return cur === desired;
}

// HIGHLIGHT PENCIL MODE (span-based)
let pencilActive = false;
let pencilMouseDown = false;
let pencilStartRange = null;

// Add pencil cursor via CSS when pencilActive: we'll set editor.style.cursor to custom
const pencilCursor = "url('highlighter.png') 0 16, auto"; // placeholder; user will replace file

function normalizeSelectionRangeForWrapping(range){
  // if range starts/ends inside a highlight span, split nodes so we can wrap only inner portion
  // This implementation is best-effort; DOM Range extraction & insertion will handle most cases.
  return range;
}

// highlight button behavior
btnHighlight.onclick = ()=>{
  const sel = window.getSelection();
  if(sel && sel.rangeCount && !sel.getRangeAt(0).collapsed){
    // If user selects highlighted text and clicks highlight, remove highlight from selection region
    const range = sel.getRangeAt(0);
    // detect if selection contains any .hl spans; if so, remove highlight for selected region
    let containsHL = false;
    const walker = document.createTreeWalker(range.commonAncestorContainer, NodeFilter.SHOW_ELEMENT | NodeFilter.SHOW_TEXT, null, false);
    let n;
    while(n = walker.nextNode()){
      if(n.nodeType === 1 && n.classList && n.classList.contains('hl')){
        // check if intersects
        try{
          const r2 = document.createRange();
          r2.selectNodeContents(n);
          if(range.compareBoundaryPoints(Range.END_TO_START, r2) < 0 && range.compareBoundaryPoints(Range.START_TO_END, r2) > 0){
            containsHL = true; break;
          }
        }catch(e){}
      }
    }
    if(containsHL){
      removeHighlightInRange(range);
      updateToolbarStates();
      return;
    }
    // otherwise apply highlight to selected text immediately
    const r = sel.getRangeAt(0).cloneRange();
    wrapRangeWithSpan(r, { background: highlightColor }, 'hl');
    updateToolbarStates();
    return;
  }
  // toggle pencil mode for typing / drag highlighting
  pencilActive = !pencilActive;
  highlightActive = pencilActive; // keep them aligned
  btnHighlight.classList.toggle('active', pencilActive);
  // change cursor
  if(pencilActive){
    editor.style.cursor = pencilCursor;
    // ensure caret behavior: when pencil is active, typing should create highlighted span
    // We already handle highlightActive in beforeinput
  } else {
    editor.style.cursor = '';
    // ensure caret moved out of highlighted spans so future typing isn't stuck
    moveCaretOutOfHighlight();
  }
  updateToolbarStates();
};

// MOUSE-DRAG highlight handling
editor.addEventListener('mousedown', (e)=>{
  if(pencilActive && e.button === 0){
    pencilMouseDown = true;
    const sel = window.getSelection();
    sel.removeAllRanges();
    pencilStartRange = document.caretRangeFromPoint ? document.caretRangeFromPoint(e.clientX, e.clientY) : document.caretPositionFromPoint ? (()=>{ const p = document.caretPositionFromPoint(e.clientX,e.clientY); const r = document.createRange(); r.setStart(p.offsetNode, p.offset); return r; })() : null;
    // prevent default selection until mouseup where we'll create our proper selection
    e.preventDefault();
  }
});

// create dynamic selection on mousemove if pencil active and mouse down
editor.addEventListener('mousemove', (e)=>{
  if(pencilActive && pencilMouseDown && pencilStartRange){
    // create selection from pencilStartRange to caret under point
    const sel = window.getSelection();
    sel.removeAllRanges();
    const endRange = document.caretRangeFromPoint ? document.caretRangeFromPoint(e.clientX, e.clientY) : (document.caretPositionFromPoint ? (()=>{ const p = document.caretPositionFromPoint(e.clientX,e.clientY); const r = document.createRange(); r.setStart(p.offsetNode, p.offset); return r; })() : null);
    if(!endRange) return;
    const r = document.createRange();
    try{
      r.setStart(pencilStartRange.startContainer, pencilStartRange.startOffset);
      r.setEnd(endRange.startContainer, endRange.startOffset);
      sel.addRange(r);
    }catch(e){}
  }
});

// finalize highlight on mouseup
editor.addEventListener('mouseup', (e)=>{
  if(pencilActive && pencilMouseDown){
    pencilMouseDown = false;
    const sel = window.getSelection();
    if(sel && sel.rangeCount && !sel.getRangeAt(0).collapsed){
      const r = sel.getRangeAt(0).cloneRange();
      wrapRangeWithSpan(r, { background: highlightColor }, 'hl');
      sel.removeAllRanges();
      // collapse caret after inserted area
      const after = document.createRange();
      after.setStart(r.endContainer, r.endOffset);
      after.collapse(true);
      sel.addRange(after);
    }
    pencilStartRange = null;
    updateToolbarStates();
  }
});

// beforeinput intercept so typing applies currentColor/highlight/typingFont/typingSize when caret collapsed
editor.addEventListener('beforeinput', (e)=>{
  // If placeholder exists, remove it before inserting anything
  const ph = editor.querySelector('.placeholder');
  if(ph) ph.remove();

  if(e.inputType === 'insertText' && e.data !== null){
    const sel = window.getSelection();
    if(!sel || !sel.rangeCount) return;
    const range = sel.getRangeAt(0);
    if(!range.collapsed){
      // normal replace of selection should be allowed; but if currentColor/highlight/typingFont present, wrap inserted text
      if(currentColor || highlightActive || typingFont || typingSize){
        e.preventDefault();
        const span = document.createElement('span');
        if(currentColor) span.style.color = currentColor;
        if(highlightActive) span.style.background = highlightColor;
        if(typingFont) span.style.fontFamily = typingFont;
        if(typingSize) span.style.fontSize = typingSize;
        span.textContent = e.data;
        range.deleteContents();
        range.insertNode(span);
        range.setStartAfter(span);
        range.setEndAfter(span);
        sel.removeAllRanges();
        sel.addRange(range);
        updateToolbarStates();
        return;
      }
      // else allow default (replace)
      return;
    }
    // collapsed caret: apply styling for inserted characters
    if(!highlightActive && !currentColor && !typingFont && !typingSize) return; // nothing special
    // Special handling for spaces: ensure spaces don't inherit formatting
    if(e.data === ' '){
      // If caret is inside formatting (span, bold/italic etc.), we want to insert a plain space **outside** formatting
      e.preventDefault();
      insertPlainSpaceAtCaret();
      updateToolbarStates();
      return;
    }
    e.preventDefault();
    const span = document.createElement('span');
    if(currentColor) span.style.color = currentColor;
    if(highlightActive) span.style.background = highlightColor;
    if(typingFont) span.style.fontFamily = typingFont;
    if(typingSize) span.style.fontSize = typingSize;
    span.textContent = e.data;
    range.insertNode(span);
    range.setStartAfter(span);
    range.setEndAfter(span);
    sel.removeAllRanges();
    sel.addRange(range);
    updateToolbarStates();
  }
});

// Insert a plain space at caret, outside formatting
function insertPlainSpaceAtCaret(){
  const sel = window.getSelection();
  if(!sel || !sel.rangeCount) return;
  const range = sel.getRangeAt(0);
  // If selection not collapsed, replace selection with plain space
  if(!range.collapsed){
    ePreventDefaultIfPresent();
    range.deleteContents();
    const t = document.createTextNode(' ');
    range.insertNode(t);
    range.setStartAfter(t);
    range.collapse(true);
    sel.removeAllRanges();
    sel.addRange(range);
    return;
  }
  // collapsed: if caret is inside a formatted ancestor (span.hl or styled span or bold etc), move caret after the ancestor and insert plain space there
  let node = range.startContainer;
  let ancestor = (node.nodeType === 3) ? node.parentElement : node;
  while(ancestor && ancestor !== editor && ancestor.nodeType === 1){
    // Consider marks: .hl or inline styles
    const isFormatted = (ancestor.classList && ancestor.classList.contains('hl')) || ancestor.tagName && ['B','I','U','S','SPAN','STRONG','EM'].includes(ancestor.tagName);
    if(isFormatted){
      const after = document.createTextNode(' ');
      insertAfter(after, ancestor);
      // place caret after the inserted space
      const r = document.createRange();
      r.setStart(after, 1);
      r.collapse(true);
      sel.removeAllRanges();
      sel.addRange(r);
      return;
    }
    ancestor = ancestor.parentElement;
  }
  // if not inside formatting, just insert a normal space
  const t = document.createTextNode(' ');
  range.insertNode(t);
  range.setStartAfter(t);
  range.collapse(true);
  sel.removeAllRanges();
  sel.addRange(range);
}

// small helper to attempt preventDefault gracefully if called from event context
function ePreventDefaultIfPresent(){ try{ if(window.event) window.event.preventDefault(); }catch(e){} }

// keyboard shortcuts
document.addEventListener('keydown', (e)=>{
  if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='b'){ e.preventDefault(); execCmd('bold'); }
  if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='i'){ e.preventDefault(); execCmd('italic'); }
  if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='u'){ e.preventDefault(); execCmd('underline'); }

  // Prevent space inheriting formatting when using formatting toggles (bold/italic/underline) — also handle physical Space key
  if(e.key === ' '){
    // if caret collapsed and inside formatted element, insert plain space
    const sel = window.getSelection();
    if(sel && sel.rangeCount){
      const range = sel.getRangeAt(0);
      if(range.collapsed){
        let node = range.startContainer;
        let ancestor = (node.nodeType === 3) ? node.parentElement : node;
        let formatted = false;
        while(ancestor && ancestor !== editor && ancestor.nodeType === 1){
          if(ancestor.classList && ancestor.classList.contains('hl')){ formatted=true; break; }
          const t = ancestor.tagName && ancestor.tagName.toLowerCase();
          if(['b','i','u','s','strong','em','span'].includes(t)){
            // check for inline styles or active commands
            const style = ancestor.getAttribute('style') || '';
            if(style.includes('font-weight') || style.includes('font-style') || style.includes('text-decoration') || style.includes('background') || style.includes('color') || ancestor.tagName.toLowerCase() !== 'span'){
              formatted = true; break;
            }
          }
          ancestor = ancestor.parentElement;
        }
        if(formatted){
          e.preventDefault();
          insertPlainSpaceAtCaret();
        }
      }
    }
  }
});

// encryption wrappers for entries
async function encryptEntry(password, payload){ return await encryptPayload(password, payload); }
async function decryptEntry(password, docData){ return await decryptPayload(password, docData); }

// load entry
async function loadEntryForDate(key){
  try{
    // clear existing page background for editorWrap
    editorWrap.style.backgroundImage = '';
    pageBackgroundByDate[key] = pageBackgroundByDate[key] || null;

    const snap = await getDoc(doc(db,'entries', key));
    if(!snap.exists()){
      editor.innerHTML = '<div class="placeholder" style="color:var(--muted)">Start writing your thoughts...</div>';
      ensurePlaceholder();
      pageBackgroundByDate[key] = null;
      applyPageBackgroundForDate(key);
      return;
    }
    const data = snap.data();
    if(data.cipher && data.iv && data.salt){
      try{
        const payload = await decryptEntry(currentPassword, data);
        // payload expected to include html, meta, diaryName, pageBackground, savedAt
        editor.innerHTML = payload.html || '';
        settingsMeta = payload.meta || settingsMeta;
        typingFont = settingsMeta.font || typingFont;
        typingSize = settingsMeta.size || typingSize;
        diaryName = payload.diaryName || diaryName;
        diaryTitle.textContent = diaryName;
        pageBackgroundByDate[key] = payload.pageBackground || null;
        applySettingsMeta();
        applyPageBackgroundForDate(key);
      } catch(e){
        editor.innerHTML = '<div class="placeholder" style="color:var(--muted)">Unable to decrypt this entry (wrong password).</div>';
        pageBackgroundByDate[key] = null;
        applyPageBackgroundForDate(key);
      }
    } else if(data.text){
      editor.innerHTML = data.text || '';
      pageBackgroundByDate[key] = null;
      applyPageBackgroundForDate(key);
    } else {
      editor.innerHTML = '<div class="placeholder" style="color:var(--muted)">Empty</div>';
      pageBackgroundByDate[key] = null;
      applyPageBackgroundForDate(key);
    }
    ensurePlaceholder();
    updateToolbarStates();
  } catch(e){ console.error('loadEntryForDate', e) }
}

// apply page background for a date (only to editorWrap)
function applyPageBackgroundForDate(key){
  const bg = pageBackgroundByDate[key];
  if(bg){
    editorWrap.style.backgroundImage = `url("${bg}")`;
    editorWrap.style.backgroundSize = 'cover';
    editorWrap.style.backgroundPosition = 'center';

    editorWrap.style.backgroundImage = '';

}

// save entry (encrypted)
async function saveEntryForDate(key, silent=false){
  const dd = new Date(key + 'T00:00:00');
  const todayStr = getYMDInTimeZone('Asia/Kolkata', new Date());
  const today = new Date(todayStr + 'T00:00:00');
  if(dd > today) { if(!silent) showToast('Cannot save future entries', false); return false; }
  ensurePlaceholder();
  const html = editor.innerHTML;
  const payload = { html, meta: settingsMeta, diaryName, pageBackground: pageBackgroundByDate[key] || null, savedAt: new Date().toISOString() };
  try{
    const enc = await encryptEntry(currentPassword, payload);
    await setDoc(doc(db,'entries', key), { ...enc, savedAt: serverTimestamp() });
    entriesIndex[key] = true;
    await loadEntriesIndexForMonth(calendarYear, calendarMonth);
    renderCalendar(calendarYear, calendarMonth);
    if(!silent) showToast('Saved', true);
    return true;
  } catch(e){
    console.error('saveEntryForDate', e);
    if(!silent) showToast('Save failed', false);
    return false;
  }
}

// apply settings meta visually
function applySettingsMeta(){
  document.body.classList.toggle('dark', settingsMeta.theme === 'dark');
  const rc = document.querySelector('.rightCol');
  if(settingsMeta.background){
    rc.style.backgroundImage = `url("${settingsMeta.background}")`;
    rc.style.backgroundSize = 'cover';
    rc.style.backgroundPosition = 'center';
  } else rc.style.backgroundImage = '';
  if(settingsMeta.font) fontSelect.value = settingsMeta.font;
  if(settingsMeta.size) sizeSelect.value = settingsMeta.size;
  editor.style.fontFamily = fontSelect.value;
  editor.style.fontSize = sizeSelect.value;
}

// save settings doc (bg, name, password)
async function saveSettingsDoc(showToastMsg=false){
  try{
    await setDoc(doc(db,'entries','settings'), { password: storedPassword, name: diaryName, bg: settingsMeta.background || "" });
    if(showToastMsg) showToast('Settings saved', true);
    return true;
  } catch(e){
    console.error('saveSettingsDoc', e);
    if(showToastMsg) showToast('Settings save failed', false);
    return false;
  }
}

// INITIALIZE: load settings and calendar
await loadSettings();
(async ()=>{
  const todayStr = getYMDInTimeZone('Asia/Kolkata', new Date());
  calendarYear = new Date(todayStr).getFullYear();
  calendarMonth = new Date(todayStr).getMonth();
  selectedDate = todayStr;
  selectedDateSpan.textContent = new Date(selectedDate).toLocaleDateString(undefined,{timeZone:'Asia/Kolkata'});
  await loadEntriesIndexForMonth(calendarYear, calendarMonth);
  renderCalendar(calendarYear, calendarMonth);
  await selectDate(selectedDate, new Date(selectedDate));
})();

// LOGIN FLOW (keeps original appearance & mechanics)
loginBtn.onclick = async ()=>{
  await loadSettings();
  if(passwordInput.value === storedPassword){
    currentPassword = passwordInput.value;
    loginDiv.style.display = 'none';
    appRoot.style.display = 'block';
    applySettingsMeta();
    await selectDate(selectedDate, new Date(selectedDate));
  } else {
    alert('Wrong password!');
  }
};

// month nav & today
prevMonth.onclick = async ()=>{ calendarMonth--; if(calendarMonth<0){calendarMonth=11;calendarYear--;} await loadEntriesIndexForMonth(calendarYear, calendarMonth); renderCalendar(calendarYear, calendarMonth); };
nextMonth.onclick = async ()=>{ calendarMonth++; if(calendarMonth>11){calendarMonth=0;calendarYear++;} await loadEntriesIndexForMonth(calendarYear, calendarMonth); renderCalendar(calendarYear, calendarMonth); };
goToday.onclick = async ()=>{ const todayStr = getYMDInTimeZone('Asia/Kolkata', new Date()); calendarYear=new Date(todayStr).getFullYear(); calendarMonth=new Date(todayStr).getMonth(); await loadEntriesIndexForMonth(calendarYear, calendarMonth); renderCalendar(calendarYear, calendarMonth); await selectDate(todayStr, new Date(todayStr)); };

// select date
async function selectDate(key, dt){
  selectedDate = key;
  selectedDateSpan.textContent = new Date(key).toLocaleDateString(undefined, { timeZone:'Asia/Kolkata' });
  calendarGrid.querySelectorAll('.dayCell').forEach(c=>c.classList.remove('selected'));
  calendarGrid.querySelectorAll('.dayCell').forEach(n=>{
    const txt = n.textContent && n.textContent.trim();
    if(txt && parseInt(txt,10) === dt.getDate()) n.classList.add('selected');
  });
  await loadEntryForDate(key);
  updateEditModeForDate(key);
}
function updateEditModeForDate(key){
  const dd = new Date(key + 'T00:00:00');
  const todayStr = getYMDInTimeZone('Asia/Kolkata', new Date());
  const today = new Date(todayStr + 'T00:00:00');
  if(dd > today){
    editor.setAttribute('contenteditable','false');
    saveTop.disabled = saveFloatingBtn.disabled = true;
  } else {
    editor.setAttribute('contenteditable','true');
    saveTop.disabled = saveFloatingBtn.disabled = false;
  }
  // show/hide page background buttons based on date (we always show them, but they operate on selectedDate)
}

// save buttons
saveTop.onclick = saveFloatingBtn.onclick = async ()=>{ if(!selectedDate) return; await saveEntryForDate(selectedDate); };

// rename & change pass & theme toggle
renameTop.onclick = async ()=>{ const newName = prompt('Enter new diary name:'); if(!newName) return; diaryName = newName; diaryTitle.textContent = diaryName; await saveSettingsDoc(true); };
changePassTop.onclick = async ()=>{ const newPass = prompt('Enter new password:'); if(!newPass) return; storedPassword = newPass; await saveSettingsDoc(true); };
themeToggleTop.onclick = async ()=>{ settingsMeta.theme = settingsMeta.theme === 'dark' ? 'light' : 'dark'; applySettingsMeta(); await saveSettingsDoc(false); };

// global background upload & remove (keeps same behavior)
bgInput.onchange = async (e)=>{
  const f = e.target.files[0];
  if(!f) return;
  const reader = new FileReader();
  reader.onload = async (ev)=>{
    settingsMeta.background = ev.target.result;
    applySettingsMeta();
    const ok = await saveSettingsDoc(false);
    if(!ok) showToast('Background save failed', false);
  };
  reader.readAsDataURL(f);
};
removeBg.onclick = async ()=>{
  settingsMeta.background = null;
  applySettingsMeta();
  const ok = await saveSettingsDoc(false);
  if(!ok) showToast('Remove background failed', false);
};

// Per-page background buttons
setPageBgBtn.onclick = ()=> {
  // create file input on the fly for page background
  const inpf = document.createElement('input');
  inpf.type = 'file';
  inpf.accept = 'image/*';
  inpf.style.position = 'fixed';
  inpf.style.left = '-9999px';
  document.body.appendChild(inpf);
  inpf.onchange = (ev)=>{
    const f = ev.target.files[0];
    if(!f) { inpf.remove(); return; }
    const reader = new FileReader();
    reader.onload = (e)=>{
      pageBackgroundByDate[selectedDate] = e.target.result;
      applyPageBackgroundForDate(selectedDate);
      // Immediately save the entry so the pageBackground is persisted; silent background save
      saveEntryForDate(selectedDate, true);
    };
    reader.readAsDataURL(f);
    inpf.remove();
  };
  inpf.click();
};
removePageBgBtn.onclick = async ()=> {
  pageBackgroundByDate[selectedDate] = null;
  applyPageBackgroundForDate(selectedDate);
  await saveEntryForDate(selectedDate, true);
};

// Autosave toggle
autoSaveToggleBtn.onclick = ()=>{
  autoSave = !autoSave;
  autoSaveToggleBtn.textContent = `AutoSave: ${autoSave ? 'On' : 'Off'}`;
  if(autoSave){
    // enable immediate debounce auto-save on input already wired
    showToast('Auto-save enabled', true);
  } else {
    if(autoSaveDebounceTimeout) clearTimeout(autoSaveDebounceTimeout);
    showToast('Auto-save disabled', true);
  }
};

// autosave trigger (debounced) — silent saves in background only if autoSave true
function triggerAutoSave(){
  if(!autoSave || !selectedDate) return;
  if(autoSaveDebounceTimeout) clearTimeout(autoSaveDebounceTimeout);
  autoSaveDebounceTimeout = setTimeout(async ()=>{
    await saveEntryForDate(selectedDate, true);
  }, 900); // 900ms debounce
}

// keyboard shortcuts for saving
document.addEventListener('keydown', (e)=>{
  if((e.ctrlKey||e.metaKey) && e.key.toLowerCase() === 's'){ e.preventDefault(); if(selectedDate) saveEntryForDate(selectedDate); }
});

// cleanup before unload (optionally save if autosave enabled)
window.addEventListener('beforeunload', (e)=>{
  if(autoSave && selectedDate && currentPassword){
    // synchronous saves are not possible with firestore here, so we rely on last autosave debounced earlier.
    // Do not block unload.
  }
});
