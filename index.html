// timezone helper (India)
function getYMDInTimeZone(timeZone='Asia/Kolkata', d=new Date()){
  const parts = new Intl.DateTimeFormat('en-CA', { timeZone, year:'numeric', month:'2-digit', day:'2-digit' }).formatToParts(d);
  const obj = {}; parts.forEach(p=>obj[p.type]=p.value);
  return `${obj.year}-${obj.month}-${obj.day}`;
}
const toYMD = d => (new Date(d)).toISOString().slice(0,10);

// crypto helpers (PBKDF2 + AES-GCM)
function b64(arr){ return btoa(String.fromCharCode(...arr)); }
function fromB64(s){ return Uint8Array.from(atob(s), c=>c.charCodeAt(0)); }

async function deriveKey(password, salt) {
  const enc = new TextEncoder();
  const base = await crypto.subtle.importKey('raw', enc.encode(password), {name:'PBKDF2'}, false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name:'PBKDF2', salt, iterations:150000, hash:'SHA-256' }, base, { name:'AES-GCM', length:256 }, false, ['encrypt','decrypt']);
}
async function encryptPayload(password, payloadObj){
  const salt = crypto.getRandomValues(new Uint8Array(16));
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const key = await deriveKey(password, salt);
  const enc = new TextEncoder();
  const data = enc.encode(JSON.stringify(payloadObj));
  const cipher = await crypto.subtle.encrypt({ name:'AES-GCM', iv }, key, data);
  return { cipher: b64(new Uint8Array(cipher)), iv: b64(iv), salt: b64(salt) };
}
async function decryptPayload(password, docData){
  const iv = fromB64(docData.iv);
  const salt = fromB64(docData.salt);
  const key = await deriveKey(password, salt);
  const cipherBuf = fromB64(docData.cipher);
  const plain = await crypto.subtle.decrypt({ name:'AES-GCM', iv }, key, cipherBuf);
  return JSON.parse(new TextDecoder().decode(plain));
}

// SETTINGS LOADING
async function loadSettings(){
  try{
    const sRef = doc(db, 'entries', 'settings');
    const snap = await getDoc(sRef);

      storedPassword = data.password || storedPassword;

      diaryTitle.textContent = diaryName;
      applySettingsMeta();
    } else {
      // create default settings
      await setDoc(sRef, { password: storedPassword, name: diaryName, bg: settingsMeta.background || "" });
    }
  } catch(e){
    console.warn('loadSettings error', e);
  }
}

// calendar index for month
async function loadEntriesIndexForMonth(year, month){
  entriesIndex = {};
  const days = new Date(year, month+1, 0).getDate();
  const promises = [];
  for(let d=1; d<=days; d++){
    const key = toYMD(new Date(year, month, d));
    promises.push((async ()=>{
      try{
        const snap = await getDoc(doc(db,'entries', key));
        if(snap.exists()) entriesIndex[key] = true;
      }catch(e){}
    })());
  }
  await Promise.all(promises);
}

// render calendar
function renderCalendar(year, month){
  calendarYear = year; calendarMonth = month;
  const first = new Date(year, month, 1);
  const startWeekday = first.getDay();
  const daysInMonth = new Date(year, month+1, 0).getDate();
  monthLabel.textContent = first.toLocaleString(undefined,{month:'long', year:'numeric'});
  calendarGrid.innerHTML = '';
  for(let i=0;i<startWeekday;i++){ const el=document.createElement('div'); el.className='dayCell disabled'; calendarGrid.appendChild(el); }
  for(let d=1; d<=daysInMonth; d++){
    const dt = new Date(year, month, d);
    const key = toYMD(dt);
    const cell = document.createElement('div');
    cell.className='dayCell';
    cell.textContent = d;
    const dot = document.createElement('div'); dot.className='dot';
    if(entriesIndex[key]) cell.classList.add('hasEntry');
    cell.appendChild(dot);
    const todayKey = getYMDInTimeZone('Asia/Kolkata', new Date());
    if(key === todayKey) cell.classList.add('today');
    cell.onclick = async ()=> { await selectDate(key, dt); };
    if(key === selectedDate) cell.classList.add('selected');
    calendarGrid.appendChild(cell);
  }
}

// select date
async function selectDate(key, dt){
  selectedDate = key;
  selectedDateSpan.textContent = new Date(key).toLocaleDateString(undefined, { timeZone:'Asia/Kolkata' });
  calendarGrid.querySelectorAll('.dayCell').forEach(c=>c.classList.remove('selected'));
  calendarGrid.querySelectorAll('.dayCell').forEach(n=>{
    const txt = n.textContent && n.textContent.trim();
    if(txt && parseInt(txt,10) === dt.getDate()) n.classList.add('selected');
  });
  await loadEntryForDate(key);
  updateEditModeForDate(key);
}
function updateEditModeForDate(key){
  const dd = new Date(key + 'T00:00:00');
  const todayStr = getYMDInTimeZone('Asia/Kolkata', new Date());
  const today = new Date(todayStr + 'T00:00:00');
  if(dd > today){

// utility: insertAfter
function insertAfter(newNode, referenceNode){
  referenceNode.parentNode.insertBefore(newNode, referenceNode.nextSibling);
}

// compare computed background color of element with highlightColor
function cssBackgroundMatchesHighlight(el){
  if(!el || el.nodeType !== 1) return false;
  const tmp = document.createElement('div');
  tmp.style.backgroundColor = highlightColor;
  document.body.appendChild(tmp);
  const desired = getComputedStyle(tmp).backgroundColor;
  document.body.removeChild(tmp);
  const cur = getComputedStyle(el).backgroundColor;
  return cur === desired;
}

// Move caret outside of ancestor with highlight or any formatting style
function moveCaretOutOfFormatting(){
  const sel = window.getSelection();
  if(!sel || !sel.rangeCount) return;
  const range = sel.getRangeAt(0);
  if(!range.collapsed) return;
  let node = range.startContainer;
  let ancestor = (node.nodeType === 3) ? node.parentElement : node;
  while(ancestor && ancestor !== editor && ancestor.nodeType === 1){
    // check if ancestor is a highlight (class hl) or has inline style for formatting
    if(ancestor.classList && ancestor.classList.contains('hl') || ancestor.style && (ancestor.style.backgroundColor || ancestor.style.color || ancestor.style.fontFamily || ancestor.style.fontSize || ancestor.tagName === 'B' || ancestor.tagName === 'I' || ancestor.tagName === 'U' || ancestor.tagName === 'S' || ancestor.tagName === 'STRONG' || ancestor.tagName === 'EM' || ancestor.tagName === 'SPAN' )){
      const spacer = document.createElement('span');
      spacer.textContent = '\u200B';
      spacer.style.background = 'transparent';
      insertAfter(spacer, ancestor);
      const newRange = document.createRange();
      newRange.setStart(spacer.firstChild, 1);
      newRange.collapse(true);
      sel.removeAllRanges();
      sel.addRange(newRange);
      // cleanup invisible spacers later
      setTimeout(()=> cleanupZeroWidthSpacers(), 300);
      return;
    }
    ancestor = ancestor.parentElement;
  }
}

// Highlight utilities: wrap a Range with highlight span
function wrapRangeWithHighlight(range){
  if(range.collapsed) return;
  // Extract content and wrap to avoid surroundContents exceptions
  const frag = range.extractContents();
  // If fragment is empty, return
  if(!frag || !frag.childNodes || frag.childNodes.length === 0){
    range.collapse(true);
    return;
  }
  const span = document.createElement('span');
  span.className = 'hl';
  span.style.background = highlightColor;
  span.appendChild(frag);
  range.insertNode(span);
  // move selection after the inserted span
  const sel = window.getSelection();
  const newRange = document.createRange();
  newRange.setStartAfter(span);
  newRange.collapse(true);
  sel.removeAllRanges();
  sel.addRange(newRange);
}

// Wrap Range with inline style(s) using a span (for color/font/size)
function wrapRangeWithStyle(range, styles = {}){
  if(range.collapsed) return;
  const frag = range.extractContents();
  if(!frag || frag.childNodes.length === 0){ range.collapse(true); return; }
  const span = document.createElement('span');
  for(const k in styles){
    span.style[k] = styles[k];
  }
  span.appendChild(frag);
  range.insertNode(span);
  // move selection after inserted node
  const sel = window.getSelection();
  const newRange = document.createRange();
  newRange.setStartAfter(span);
  newRange.collapse(true);
  sel.removeAllRanges();
  sel.addRange(newRange);
}

// Remove highlight spans inside a range (handles partial spans)
function removeHighlightFromRange(range){
  if(range.collapsed) return;
  // extract fragment, remove hl spans within it, then insert back
  const frag = range.extractContents();
  // function to recursively remove hl spans and replace with their children
  (function cleanse(node){
    const children = Array.from(node.childNodes);
    children.forEach(ch=>{
      if(ch.nodeType === 1){
        if(ch.classList && ch.classList.contains('hl')){
          // replace the element with its children (unwrapping)
          while(ch.firstChild) node.insertBefore(ch.firstChild, ch);
          node.removeChild(ch);
        } else {
          cleanse(ch);
        }
      }
    });
  })(frag);
  // insert cleaned fragment back
  range.insertNode(frag);
  // set caret at end of inserted fragment
  const sel = window.getSelection();
  const newRange = document.createRange();
  // find last inserted node (we can use range.startContainer and move forward)
  newRange.setStart(range.startContainer, getInsertionOffset(range.startContainer));
  newRange.collapse(true);
  sel.removeAllRanges();
  sel.addRange(newRange);

  // helper to compute an offset - safe fallback
  function getInsertionOffset(node){
    // if node is text node, return its length; else if node has childNodes, return childNodes.length; fall back to 0
    if(node.nodeType === 3) return node.length;
    if(node.childNodes && node.childNodes.length) return node.childNodes.length;
    return 0;
  }
}

// Generic removal of <span class="hl"> across selection using similar approach (works better than trying to split spans)
function toggleHighlightOnSelectionOrTyping(){
  const sel = window.getSelection();
  if(sel && sel.rangeCount && !sel.getRangeAt(0).collapsed){
    const r = sel.getRangeAt(0);
    // If selection contains any hl nodes entirely or partially, remove highlight only in selection
    // determine if selection contains hl nodes by scanning
    const containsHL = (function scan(node){
      if(!node) return false;
      if(node.nodeType === 1 && node.classList && node.classList.contains('hl')) return true;
      for(let c=node.firstChild; c; c=c.nextSibling){
        if(scan(c)) return true;
      }
      return false;
    })(r.cloneContents());
    if(containsHL){
      removeHighlightFromRange(r);
      return;
    } else {
      // apply highlight to selection
      wrapRangeWithHighlight(r);
      return;
    }
  } else {
    // no selection — toggle typing-state (handled elsewhere)
    highlightActive = !highlightActive;
    btnHighlight.classList.toggle('active', highlightActive);
    // set cursor
    if(highlightActive){
      editor.style.cursor = "url('highlighter.png') 0 16, auto";
    } else {
      editor.style.cursor = '';
      // if turning off highlight ensure caret is outside highlighted span
      moveCaretOutOfFormatting();
    }
  }
}

// cleanup helper: remove stray zero-width space nodes that may remain (keeps caret integrity)
function cleanupZeroWidthSpacers(){
  try{
    const nodes = editor.querySelectorAll('span');
    nodes.forEach(s=>{
      if(s.textContent === '\u200B'){
        const sel = window.getSelection();
        let keep = false;
        if(sel && sel.rangeCount){
          const r = sel.getRangeAt(0);
          if(r.startContainer === s.firstChild) keep = true;
        }
        if(!keep) s.remove();
      }
    });
  }catch(e){}
}

// encryption wrappers for entries
async function encryptEntry(password, payload){ return await encryptPayload(password, payload); }
async function decryptEntry(password, docData){ return await decryptPayload(password, docData); }

// load entry
async function loadEntryForDate(key){
  try{
    const snap = await getDoc(doc(db,'entries', key));
    if(!snap.exists()){
      editor.innerHTML = '<div class="placeholder" style="color:var(--muted)">Start writing your thoughts...</div>';
      applyPageBackgroundForDate(null);
      ensurePlaceholder();
      return;
    }
    const data = snap.data();
    if(data.cipher && data.iv && data.salt){
      try{
        const payload = await decryptEntry(currentPassword, data);
        editor.innerHTML = payload.html || '';
        settingsMeta = payload.meta || settingsMeta;
        diaryName = payload.diaryName || diaryName;
        diaryTitle.textContent = diaryName;
        applySettingsMeta();
        // pageBackground is stored inside payload.pageBackground
        if(payload.pageBackground){
          pageBackgrounds[key] = payload.pageBackground;
          applyPageBackgroundForDate(payload.pageBackground);
        } else {
          // clear per-day background if none
          delete pageBackgrounds[key];
          applyPageBackgroundForDate(null);
        }
      } catch(e){
        editor.innerHTML = '<div class="placeholder" style="color:var(--muted)">Unable to decrypt this entry (wrong password).</div>';
      }
    } else if(data.text){
      editor.innerHTML = data.text || '';
    } else {
      editor.innerHTML = '<div class="placeholder" style="color:var(--muted)">Empty</div>';
    }
  } catch(e){ console.error('loadEntryForDate', e) }
}

  const payload = { html, meta: settingsMeta, diaryName, pageBackground: pageBackgrounds[key] || null, savedAt: new Date().toISOString() };
  try{
    const enc = await encryptEntry(currentPassword, payload);

/* ------------------------------
   Clear formatting (robust)
   - removes bold, italic, underline, strike, color, background, font-family, font-size
   - preserves lists and structure
   ------------------------------ */
clearFmt.onclick = ()=>{
  clearFormatting();
};

function clearFormatting(){
  const sel = window.getSelection();
  if(!sel || !sel.rangeCount){
    // nothing selected: apply to entire editor content as fallback (but avoid converting lists)
    const range = document.createRange();
    range.selectNodeContents(editor);
    stripFormattingInRange(range);
    return;
  }
  const range = sel.getRangeAt(0);
  if(range.collapsed){
    // collapsed: try to expand to current word or current container
    const container = range.startContainer;
    const nodeToClear = (container.nodeType === 3) ? container.parentElement : container;
    // create range covering nodeToClear
    const r2 = document.createRange();
    r2.selectNodeContents(nodeToClear);
    stripFormattingInRange(r2);
    return;
  } else {
    stripFormattingInRange(range);
    return;
  }
}

function stripFormattingInRange(range){
  // Extract contents, clean, reinsert so lists/structure remain safe
  const frag = range.extractContents();
  cleanseNode(frag);
  range.insertNode(frag);
  // collapse selection to end of inserted fragment
  const sel = window.getSelection();
  sel.removeAllRanges();
  const newRange = document.createRange();
  newRange.setStart(range.endContainer, range.endOffset);
  newRange.collapse(true);
  sel.addRange(newRange);

  function cleanseNode(node){
    const children = Array.from(node.childNodes);
    children.forEach(ch=>{
      if(ch.nodeType === 1){
        const tag = ch.tagName;
        // preserve these structural tags (do not unwrap)
        const preserve = ['UL','OL','LI','PRE','BLOCKQUOTE','TABLE','TR','TD','TH','TBODY','THEAD'];
        if(preserve.includes(tag)){
          // recurse into children
          cleanseNode(ch);
          return;
        }

        // if element is one of formatting tags, unwrap it (but keep children)
        const formattingTags = ['B','STRONG','I','EM','U','S','STRIKE','FONT','SPAN'];
        if(formattingTags.includes(tag)){
          // remove attributes from span/font
          if(tag === 'SPAN' || tag === 'FONT'){
            // remove only styling attributes, keep classes if any (but user requested removing styles)
            ch.removeAttribute('style');
            ch.removeAttribute('color');
            ch.removeAttribute('face');
            ch.removeAttribute('size');
            // if span has no meaningful attributes, unwrap
            const hasAttrs = ch.attributes && ch.attributes.length > 0;
            if(!hasAttrs){
              while(ch.firstChild) node.insertBefore(ch.firstChild, ch);
              node.removeChild(ch);
              return;
            } else {
              // still keep it after removing styles
              cleanseNode(ch);
              return;
            }
          } else {
            // unwrap tag B/I/U/S/STRONG/EM
            while(ch.firstChild) node.insertBefore(ch.firstChild, ch);
            node.removeChild(ch);
            return;
          }
        } else {
          // remove formatting-related inline styles
          if(ch.style){
            ch.style.removeProperty('font-weight');
            ch.style.removeProperty('font-style');
            ch.style.removeProperty('text-decoration');
            ch.style.removeProperty('text-decoration-line');
            ch.style.removeProperty('color');
            ch.style.removeProperty('background');
            ch.style.removeProperty('background-color');
            ch.style.removeProperty('font-family');
            ch.style.removeProperty('font-size');
          }
          // continue recursion
          cleanseNode(ch);
        }
      } else if(ch.nodeType === 3){
        // text node: leave it
      }
    });
  }
}

/* ------------------------------
   beforeinput handler for typed characters:
   - handles typing with currentColor / highlightActive / typingFont / typingSize
   - ensures spaces are plain text and don't retain formatting
   ------------------------------ */
editor.addEventListener('beforeinput', (e)=>{
  if(e.inputType === 'insertText' && typeof e.data === 'string'){
    const sel = window.getSelection();
    if(!sel || !sel.rangeCount) return;
    const range = sel.getRangeAt(0);

    // If selection not collapsed, default behavior is to replace selection - we'll handle similarly
    e.preventDefault();

    // When the inserted character is a space, insert plain text space without styles, and move caret outside formatted ancestors
    if(e.data === ' '){
      // insert plain text node
      const textNode = document.createTextNode(' ');
      range.deleteContents();
      range.insertNode(textNode);
      // move caret after space
      const newRange = document.createRange();
      newRange.setStartAfter(textNode);
      newRange.collapse(true);
      sel.removeAllRanges();
      sel.addRange(newRange);
      // ensure caret is outside formatting (so next typed char doesn't inherit formatting)
      moveCaretOutOfFormatting();
      updateToolbarStates();
      return;
    }

    // Otherwise, create a span with appropriate styles
    const span = document.createElement('span');
    if(currentColor) span.style.color = currentColor;
    if(highlightActive) span.className = 'hl', span.style.background = highlightColor;
    if(typingFont) span.style.fontFamily = typingFont;
    if(typingSize) span.style.fontSize = typingSize;
    span.textContent = e.data;
    range.deleteContents();
    range.insertNode(span);
    // place caret after span
    range.setStartAfter(span);
    range.collapse(true);
    sel.removeAllRanges();
    sel.addRange(range);
    updateToolbarStates();
  }
});
