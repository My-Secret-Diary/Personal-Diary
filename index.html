/* helper to create color swatches including custom color "+" */
function createColorSwatches(){
  colorPopup.innerHTML = '';
  // add palette colors
  paletteColors.forEach(c=>{
    const s = document.createElement('div');
    s.className='sw';
    s.style.background = c;
    s.title = c;
    s.onclick = ()=>{
      // apply color as typing color or to selection
      applyColorToSelectionOrTyping(c);
      currentColor = c;
      colorPreview.style.background = c;

      colorPopup.style.display = 'none';
      colorIcon.classList.add('active');
    };
    colorPopup.appendChild(s);
  });

  // add custom picker square ("+")

  add.style.display = 'flex';

  add.style.justifyContent = 'center';

  add.style.fontSize = '16px';

    input.style.position = 'fixed';
    input.style.left = '-9999px';

    input.click();
    input.oninput = ()=>{

      input.remove();
    };
    // cleanup if user cancels
    input.onblur = ()=> { input.remove(); };
  };
  colorPopup.appendChild(add);
}

/* timezone helper (India) */
function getYMDInTimeZone(timeZone='Asia/Kolkata', d=new Date()){
  const parts = new Intl.DateTimeFormat('en-CA', { timeZone, year:'numeric', month:'2-digit', day:'2-digit' }).formatToParts(d);
  const obj = {}; parts.forEach(p=>obj[p.type]=p.value);
  return `${obj.year}-${obj.month}-${obj.day}`;
}
const toYMD = d => (new Date(d)).toISOString().slice(0,10);

/* crypto helpers (unchanged) */
function b64(arr){ return btoa(String.fromCharCode(...arr)); }
function fromB64(s){ return Uint8Array.from(atob(s), c=>c.charCodeAt(0)); }

async function deriveKey(password, salt) {
  const enc = new TextEncoder();
  const base = await crypto.subtle.importKey('raw', enc.encode(password), {name:'PBKDF2'}, false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name:'PBKDF2', salt, iterations:150000, hash:'SHA-256' }, base, { name:'AES-GCM', length:256 }, false, ['encrypt','decrypt']);
}
async function encryptPayload(password, payloadObj){
  const salt = crypto.getRandomValues(new Uint8Array(16));
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const key = await deriveKey(password, salt);
  const enc = new TextEncoder();
  const data = enc.encode(JSON.stringify(payloadObj));
  const cipher = await crypto.subtle.encrypt({ name:'AES-GCM', iv }, key, data);
  return { cipher: b64(new Uint8Array(cipher)), iv: b64(iv), salt: b64(salt) };
}
async function decryptPayload(password, docData){
  const iv = fromB64(docData.iv);
  const salt = fromB64(docData.salt);
  const key = await deriveKey(password, salt);
  const cipherBuf = fromB64(docData.cipher);
  const plain = await crypto.subtle.decrypt({ name:'AES-GCM', iv }, key, cipherBuf);
  return JSON.parse(new TextDecoder().decode(plain));
}

/* ===== SETTINGS LOADING (unchanged logic, but we keep settingsMeta.background separate from per-day backgrounds) ===== */
async function loadSettings(){
  try{
    const sRef = doc(db, 'entries', 'settings');
    const snap = await getDoc(sRef);
    if(snap.exists()){
      const data = snap.data();
      storedPassword = data.password || storedPassword;
      diaryName = data.name || diaryName;
      if(data.bg) settingsMeta.background = data.bg;
      diaryTitle.textContent = diaryName;
      applySettingsMeta();
    } else {
      // create default settings
      await setDoc(sRef, { password: storedPassword, name: diaryName, bg: settingsMeta.background || "" });
    }
  } catch(e){
    console.warn('loadSettings error', e);
  }
}

/* ===== Calendar helpers (unchanged) ===== */
async function loadEntriesIndexForMonth(year, month){
  entriesIndex = {};
  const days = new Date(year, month+1, 0).getDate();
  const promises = [];
  for(let d=1; d<=days; d++){
    const key = toYMD(new Date(year, month, d));
    promises.push((async ()=>{
      try{
        const snap = await getDoc(doc(db,'entries', key));
        if(snap.exists()) entriesIndex[key] = true;
      }catch(e){}
    })());
  }
  await Promise.all(promises);
}

function renderCalendar(year, month){
  calendarYear = year; calendarMonth = month;
  const first = new Date(year, month, 1);
  const startWeekday = first.getDay();
  const daysInMonth = new Date(year, month+1, 0).getDate();
  monthLabel.textContent = first.toLocaleString(undefined,{month:'long', year:'numeric'});
  calendarGrid.innerHTML = '';
  for(let i=0;i<startWeekday;i++){ const el=document.createElement('div'); el.className='dayCell disabled'; calendarGrid.appendChild(el); }
  for(let d=1; d<=daysInMonth; d++){
    const dt = new Date(year, month, d);
    const key = toYMD(dt);
    const cell = document.createElement('div');
    cell.className='dayCell';
    cell.textContent = d;
    const dot = document.createElement('div'); dot.className='dot';
    if(entriesIndex[key]) cell.classList.add('hasEntry');
    cell.appendChild(dot);
    const todayKey = getYMDInTimeZone('Asia/Kolkata', new Date());
    if(key === todayKey) cell.classList.add('today');
    cell.onclick = async ()=> { await selectDate(key, dt); };
    if(key === selectedDate) cell.classList.add('selected');
    calendarGrid.appendChild(cell);
  }
}

/* ===== selectDate and editing mode ===== */
async function selectDate(key, dt){
  selectedDate = key;
  selectedDateSpan.textContent = new Date(key).toLocaleDateString(undefined, { timeZone:'Asia/Kolkata' });
  calendarGrid.querySelectorAll('.dayCell').forEach(c=>c.classList.remove('selected'));
  calendarGrid.querySelectorAll('.dayCell').forEach(n=>{
    const txt = n.textContent && n.textContent.trim();
    if(txt && parseInt(txt,10) === dt.getDate()) n.classList.add('selected');
  });
  await loadEntryForDate(key);
  updateEditModeForDate(key);
}
function updateEditModeForDate(key){
  const dd = new Date(key + 'T00:00:00');
  const todayStr = getYMDInTimeZone('Asia/Kolkata', new Date());
  const today = new Date(todayStr + 'T00:00:00');
  if(dd > today){
    editor.setAttribute('contenteditable','false');

/* Insert after helper */
function insertAfter(newNode, referenceNode){
  referenceNode.parentNode.insertBefore(newNode, referenceNode.nextSibling);
}

/* Detect element has computed background equal to highlightColor (used for caret normalization) */
function cssBackgroundMatchesHighlight(el){
  if(!el || el.nodeType !== 1) return false;
  const tmp = document.createElement('div');
  tmp.style.backgroundColor = highlightColor;
  document.body.appendChild(tmp);
  const desired = getComputedStyle(tmp).backgroundColor;
  document.body.removeChild(tmp);
  const cur = getComputedStyle(el).backgroundColor;
  return cur === desired;
}

/* Move caret out of highlight when highlight toggled off (keeps caret from inheriting highlight) */
function moveCaretOutOfHighlight(){
  const sel = window.getSelection();
  if(!sel || !sel.rangeCount) return;
  const range = sel.getRangeAt(0);
  if(!range.collapsed) return; // only needed when caret collapsed
  let node = range.startContainer;
  let ancestor = (node.nodeType === 3) ? node.parentElement : node;
  while(ancestor && ancestor !== editor && ancestor.nodeType === 1){
    if(ancestor.classList && ancestor.classList.contains('hl')){
      // found a highlighted ancestor - we need to move caret just after the highlighted element
      const spacer = document.createElement('span');
      spacer.textContent = '\u200B';
      spacer.style.background = 'transparent';
      insertAfter(spacer, ancestor);
      const newRange = document.createRange();
      newRange.setStart(spacer.firstChild, 1);
      newRange.collapse(true);
      sel.removeAllRanges();
      sel.addRange(newRange);

      setTimeout(()=> {
        try{
          const allSpacers = editor.querySelectorAll('span');
          allSpacers.forEach(s=>{
            if(s.textContent === '\u200B'){
              const sel2 = window.getSelection();
              if(sel2 && sel2.rangeCount){
                const r = sel2.getRangeAt(0);
                if(r.startContainer === s.firstChild) return; // keep it
              }
              s.remove();
            }
          });
        }catch(e){}
      }, 400);
      return;
    }
    ancestor = ancestor.parentElement;
  }
}

/* ===== Highlighting: span-based wrapping and removal ===== */

/* Create a wrapper span.hl and wrap a given Range (may span multiple nodes).
   This function carefully handles partly overlapping nodes by using Range.surroundContents when safe,
   otherwise it extracts contents and wraps them.
*/
function wrapRangeInHighlight(range){
  if(range.collapsed) return;
  // Extract contents, wrap them in span.hl, and insert back
  const span = document.createElement('span');
  span.className = 'hl';
  span.style.background = highlightColor;
  try {
    const docfrag = range.extractContents();
    // If docfrag is empty, bail out
    span.appendChild(docfrag);
    range.insertNode(span);
    // Normalize to merge adjacent text nodes
    span.normalize();
  } catch(e){
    // fallback: try using surroundContents if possible
    try{
      range.surroundContents(span);
    } catch(err){
      // Last resort: iterate and wrap text nodes
      const text = range.toString();
      if(text.trim().length){
        range.deleteContents();
        span.textContent = text;
        range.insertNode(span);
      }
    }
  }
}

/* Remove highlight spans inside the given Range only (partial removal supported)
   Approach: we'll iterate nodes within range, and for any ancestor .hl, we will split it at the selection boundaries and remove the .hl wrapper from nodes fully inside selection, leaving outer parts intact.
*/
function removeHighlightFromRange(range){
  if(range.collapsed) return;
  // Get all elements that are within the range
  const walker = document.createTreeWalker(range.commonAncestorContainer, NodeFilter.SHOW_ELEMENT | NodeFilter.SHOW_TEXT, {
    acceptNode(node){
      // accept only nodes that intersect selection range
      if(node.nodeType === 3 || node.nodeType === 1){
        const nodeRange = document.createRange();
        try{
          nodeRange.selectNodeContents(node);
        }catch(e){
          try{
            nodeRange.selectNode(node);
          }catch(e){
            return NodeFilter.FILTER_REJECT;
          }
        }
        if(range.compareBoundaryPoints(Range.END_TO_START, nodeRange) >= 0 || range.compareBoundaryPoints(Range.START_TO_END, nodeRange) <= 0){
          return NodeFilter.FILTER_REJECT;
        }
        return NodeFilter.FILTER_ACCEPT;
      }
      return NodeFilter.FILTER_REJECT;
    }
  });

  const toProcess = [];
  let n;
  while(n = walker.nextNode()){
    toProcess.push(n);
  }

  // For each node, find closest ancestor .hl and unwrap the portion that intersects
  toProcess.forEach(node=>{
    let anc = node.nodeType === 3 ? node.parentElement : node;
    while(anc && anc !== editor){
      if(anc.classList && anc.classList.contains('hl')) break;
      anc = anc.parentElement;
    }
    if(anc && anc !== editor){
      // Split the ancestor .hl so selection interior can be unwrapped
      // Use range.cloneRange to extract the portion within anc & selection
      const localRange = range.cloneRange();
      try {
        // limit localRange to inside the anc
        localRange.setStart(Math.max(localRange.startOffset, (function(){ 
          // find offset relative to ancestor if ancestor contains startContainer
          if(localRange.startContainer && anc.contains(localRange.startContainer)){
            return (0);
          } else return 0;
        })()), localRange.startOffset);
      } catch(e){}
      // We'll unwrap the selected parts by replacing anc with its child nodes but only for parts fully inside selection
      // Simpler approach: if selection intersects anc, we'll replace anc with its children, but keep portions outside selection by splitting anc into parts.
      try{
        // Create ranges to extract parts before, inside, after relative to anc
        const ancRange = document.createRange();
        ancRange.selectNodeContents(anc);

        const interRange = ancRange.cloneRange();
        interRange.setStart(Math.max(range.startContainer === anc ? range.startOffset : Math.max(range.startOffset, 0), ancRange.startOffset));
        // Instead of complex offsets, we'll do a pragmatic approach: if entire anc is within selection, unwrap anc completely
        if(range.compareBoundaryPoints(Range.START_TO_START, ancRange) <= 0 && range.compareBoundaryPoints(Range.END_TO_END, ancRange) >= 0){
          // full overlap -> unwrap anc
          const parent = anc.parentNode;
          while(anc.firstChild) parent.insertBefore(anc.firstChild, anc);
          parent.removeChild(anc);
        } else {
          // partial overlap -> split ancestor into three parts and unwrap middle
          // We'll use Ranges based on actual node boundaries: create a newRange representing intersection between range and anc
          const inter = document.createRange();
          inter.setStart(range.startContainer, range.startOffset);
          inter.setEnd(range.endContainer, range.endOffset);
          // Clip inter to anc by checking containment
          if(!anc.contains(inter.startContainer)){
            // adjust start to beginning of anc
            inter.setStart(anc.firstChild || anc, 0);
          }
          if(!anc.contains(inter.endContainer)){
            inter.setEnd(anc.lastChild || anc, anc.lastChild ? (anc.lastChild.textContent ? anc.lastChild.textContent.length : 0) : 0);
          }
          // Extract intersection contents and insert them in place, thereby removing hl for that part
          const frag = inter.extractContents();
          inter.insertNode(frag);
          // After extraction, if anc still exists with no hl needs, it will remain. We will also cleanup empty hl nodes later.
        }
      } catch(e){
        // fallback: remove hl class and style if simple
        anc.classList.remove('hl');
        anc.style.background = '';
      }
    }
  });

  // final pass: unwrap any empty .hl or merge text nodes
  const hls = editor.querySelectorAll('.hl');
  hls.forEach(h=>{
    if(!h.textContent.trim()){
      // remove empty highlight
      h.remove();
    } else {
      // If child doesn't need highlight (e.g. style was removed), ensure class exists only where needed - skip for now
    }
  });
  editor.normalize();
}

/* Apply highlight to current selection (or typed text will be handled in beforeinput) */
function applyHighlightToSelection(){
  const sel = window.getSelection();
  if(!sel || !sel.rangeCount) return;
  for(let i=0;i<sel.rangeCount;i++){
    const r = sel.getRangeAt(i);
    if(!r.collapsed){
      wrapRangeInHighlight(r);
    }
  }
  // after applying highlight, ensure caret isn't stuck inside same-highlight (so typing new text won't be highlighted if highlightActive was turned off)
  updateToolbarStates();
}

/* When user selects a highlighted area and presses highlight tool again, remove highlight from selection */
function toggleHighlightForSelectionRemoval(){
  const sel = window.getSelection();
  if(!sel || !sel.rangeCount || sel.getRangeAt(0).collapsed) return false;
  const r = sel.getRangeAt(0);
  // check if selection contains any highlighted node
  let containsHl = false;
  const walker = document.createTreeWalker(r.commonAncestorContainer, NodeFilter.SHOW_ELEMENT | NodeFilter.SHOW_TEXT, {
    acceptNode(node){
      if(node.nodeType === 1 && node.classList && node.classList.contains('hl')) return NodeFilter.FILTER_ACCEPT;
      if(node.nodeType === 3) {
        // text node - check if ancestor is hl inside range
        let anc = node.parentElement;
        while(anc && anc !== editor){
          if(anc.classList && anc.classList.contains('hl')) return NodeFilter.FILTER_ACCEPT;
          anc = anc.parentElement;
        }
      }
      return NodeFilter.FILTER_REJECT;
    }
  });
  while(walker.nextNode()){
    containsHl = true; break;
  }
  if(containsHl){
    removeHighlightFromRange(r);
    updateToolbarStates();
    return true;
  }
  return false;
}

/* ===== beforeinput handler: handle typed characters to apply typingFont/typingSize/currentColor/highlightActive; and prevent formatting on spaces ===== */
editor.addEventListener('beforeinput', (e)=>{
  // Only handle insertText events (typing)
  if(e.inputType === 'insertText' && e.data !== null){
    const sel = window.getSelection();
    if(!sel || !sel.rangeCount) return;
    const range = sel.getRangeAt(0);
    if(!range.collapsed) return; // default behavior when there's a selection (let execCommand do replacements if needed)
    // If the typed character is a space (or whitespace), we must ensure it's plain text (no formatting)
    if(/\s/.test(e.data)){
      e.preventDefault();
      const textNode = document.createTextNode(e.data);
      range.insertNode(textNode);
      // move caret after the inserted space
      range.setStartAfter(textNode);
      range.setEndAfter(textNode);
      sel.removeAllRanges();
      sel.addRange(range);
      // After space typed, move caret out of highlight to avoid carrying formatting
      if(highlightActive || currentColor || typingFont || typingSize){
        moveCaretOutOfHighlight();
      }
      updateToolbarStates();
      return;
    }

    // If there are no styling flags active, normal typing is fine
    if(!highlightActive && !currentColor && !typingFont && !typingSize) return;

    e.preventDefault();
    // create a span to wrap the typed character(s)
    const span = document.createElement('span');
    if(currentColor) span.style.color = currentColor;
    if(highlightActive) span.classList.add('hl'), span.style.background = highlightColor;
    if(typingFont) span.style.fontFamily = typingFont;
    if(typingSize) span.style.fontSize = typingSize;
    // insert the typed data
    span.textContent = e.data;
    range.insertNode(span);
    // move caret after span
    range.setStartAfter(span);
    range.setEndAfter(span);
    sel.removeAllRanges();
    sel.addRange(range);
    updateToolbarStates();
  }
});

/* Cleanup stray zero-width spacers */
function cleanupZeroWidthSpacers(){
  try{
    const nodes = editor.querySelectorAll('span');
    nodes.forEach(s=>{
      if(s.textContent === '\u200B'){
        const sel = window.getSelection();
        let keep = false;
        if(sel && sel.rangeCount){
          const r = sel.getRangeAt(0);
          if(r.startContainer === s.firstChild) keep = true;
        }
        if(!keep) s.remove();
      }
    });
  }catch(e){}
}

  if(!editor.innerText.trim()){
    editor.innerHTML = '<div class="placeholder" style="color:var(--muted)">Start writing your thoughts...</div>';
  } else {
    const ph = editor.querySelector('.placeholder');
    if(ph) ph.remove();
  }
}

  ensurePlaceholder(); 
  updateToolbarStates(); 
});

editor.addEventListener('focus', ()=> {
  // on focus ensure caret is not stuck inside a highlight when highlight is OFF
  const ph = editor.querySelector('.placeholder');
  if(ph){
    // remove placeholder and set caret at end of editor
    ph.remove();
    // place caret at end
    const range = document.createRange();
    range.selectNodeContents(editor);
    range.collapse(false);
    const sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
  }
  if(!highlightActive) moveCaretOutOfHighlight();
});

/* Apply font change: if selection exists, wrap only that selection in span with font-family.

    const span = document.createElement('span');
    span.style.fontFamily = val;
    try{
      span.appendChild(r.extractContents());
      r.insertNode(span);
    } catch(e){
      try{ r.surroundContents(span); }catch(e){ /* fallback - do nothing */ }

/* ===== Encryption wrappers for entries (unchanged) ===== */
async function encryptEntry(password, payload){ return await encryptPayload(password, payload); }
async function decryptEntry(password, docData){ return await decryptPayload(password, docData); }

/* ===== Load and Save entry for date (modified to handle pageBackground in payload) ===== */
async function loadEntryForDate(key){
  try{
    const snap = await getDoc(doc(db,'entries', key));
    currentPageBackground = null;
    if(!snap.exists()){
      editor.innerHTML = '<div class="placeholder" style="color:var(--muted)">Start writing your thoughts...</div>';
      ensurePlaceholder();
      applyPageBackground(null);
      return;
    }
    const data = snap.data();
    if(data.cipher && data.iv && data.salt){
      try{
        const payload = await decryptEntry(currentPassword, data);
        editor.innerHTML = payload.html || '';
        settingsMeta = payload.meta || settingsMeta;
        diaryName = payload.diaryName || diaryName;
        // load pageBackground if present
        currentPageBackground = payload.pageBackground || null;
        diaryTitle.textContent = diaryName;
        applySettingsMeta();
        applyPageBackground(currentPageBackground);
      } catch(e){
        editor.innerHTML = '<div class="placeholder" style="color:var(--muted)">Unable to decrypt this entry (wrong password).</div>';
        applyPageBackground(null);
      }
    } else if(data.text){
      editor.innerHTML = data.text || '';
      applyPageBackground(null);
    } else {
      editor.innerHTML = '<div class="placeholder" style="color:var(--muted)">Empty</div>';
      applyPageBackground(null);
    }
  } catch(e){ console.error('loadEntryForDate', e) }
}

/* Save entry: include pageBackground field inside encrypted payload (added without changing Firebase paths) */
async function saveEntryForDate(key){
  const dd = new Date(key + 'T00:00:00');
  const todayStr = getYMDInTimeZone('Asia/Kolkata', new Date());
  const today = new Date(todayStr + 'T00:00:00');
  if(dd > today) { showToast('Cannot save future entries', false); return false; }
  ensurePlaceholder();
  const html = editor.innerHTML;
  // include pageBackground property in payload as requested
  const payload = { html, meta: settingsMeta, diaryName, pageBackground: currentPageBackground || null, savedAt: new Date().toISOString() };
  try{
    const enc = await encryptEntry(currentPassword, payload);
    await setDoc(doc(db,'entries', key), { ...enc, savedAt: serverTimestamp() });
    entriesIndex[key] = true;
    await loadEntriesIndexForMonth(calendarYear, calendarMonth);
    renderCalendar(calendarYear, calendarMonth);
    showToast('Saved', true);
    return true;
  } catch(e){
    console.error('saveEntryForDate', e);
    showToast('Save failed', false);
    return false;
  }
}

};

/* ===== keyboard shortcuts (unchanged) ===== */
document.addEventListener('keydown', (e)=>{
  if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='b'){ e.preventDefault(); execCmd('bold'); }
  if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='i'){ e.preventDefault(); execCmd('italic'); }
  if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='u'){ e.preventDefault(); execCmd('underline'); }
});

/* ===== Toolbar bindings for basic commands (unchanged except clear formatting) ===== */
btnBold.onclick = ()=> execCmd('bold');
btnItalic.onclick = ()=> execCmd('italic');
btnUnderline.onclick = ()=> execCmd('underline');
btnStrike.onclick = ()=> execCmd('strikeThrough');

btnBullet.onclick = ()=> execCmd('insertUnorderedList');
btnNumber.onclick = ()=> execCmd('insertOrderedList');

alignLeft.onclick = ()=> execCmd('justifyLeft');
alignCenter.onclick = ()=> execCmd('justifyCenter');
alignRight.onclick = ()=> execCmd('justifyRight');

/* Clear formatting: improved - removes bold/italic/underline/strike/color/highlight/font-family/font-size within selection or entire editor, but preserves lists and text.
   Does not remove text nor convert lists to plain text.
*/
function clearFormatting(){
  const sel = window.getSelection();
  let range;
  if(sel && sel.rangeCount && !sel.getRangeAt(0).collapsed){
    range = sel.getRangeAt(0).cloneRange();
  } else {
    // full editor
    range = document.createRange();
    range.selectNodeContents(editor);
  }
  // walk nodes in range and clean inline formatting
  const walker = document.createTreeWalker(range.commonAncestorContainer, NodeFilter.SHOW_ELEMENT | NodeFilter.SHOW_TEXT, {
    acceptNode(node){
      // skip if outside range
      const nodeRange = document.createRange();
      try{
        nodeRange.selectNodeContents(node);
      }catch(e){
        try{ nodeRange.selectNode(node); }catch(e){ return NodeFilter.FILTER_REJECT; }
      }
      if(range.compareBoundaryPoints(Range.END_TO_START, nodeRange) >= 0 || range.compareBoundaryPoints(Range.START_TO_END, nodeRange) <= 0){
        return NodeFilter.FILTER_REJECT;
      }
      return NodeFilter.FILTER_ACCEPT;
    }
  });

  const nodes = [];
  let n;
  while(n = walker.nextNode()) nodes.push(n);

  nodes.forEach(node=>{
    if(node.nodeType === 1){
      const tag = node.tagName.toLowerCase();
      // preserve lists: ul, ol, li, p, div, br, span allowed. We'll unwrap formatting tags like b, strong, i, em, u, s, strike, font
      if(['b','strong','i','em','u','s','strike','font','span','small','big'].includes(tag)){
        // For spans, inspect styles - if they have font-family/font-size/color/background remove those style attributes
        if(tag === 'span'){
          // If this span is purely formatting (no attributes left after removing), we might unwrap it.
          node.style.fontFamily = '';
          node.style.fontSize = '';
          node.style.color = '';
          node.style.background = '';
          node.classList.remove('hl');
          // If the element has no attributes now, unwrap it
          if(!node.getAttributeNames().length && !node.style.cssText.trim()){
            const parent = node.parentNode;
            while(node.firstChild) parent.insertBefore(node.firstChild, node);
            parent.removeChild(node);
          }
        } else {
          // unwrap but keep children
          const parent = node.parentNode;
          while(node.firstChild) parent.insertBefore(node.firstChild, node);
          parent.removeChild(node);
        }
      } else {
        // non-formatting tag: remove inline styles relevant to formatting (but preserve lists)
        if(node.style){
          node.style.fontFamily = '';
          node.style.fontSize = '';
          node.style.color = '';
          node.style.background = '';
        }
      }
    } else if(node.nodeType === 3){
      // text nodes - nothing to do
    }
  });

  // After cleaning, normalize and ensure no stray empty nodes
  editor.normalize();
  ensurePlaceholder();
  updateToolbarStates();
}
clearFmt.onclick = clearFormatting;

/* ===== Highlight toggle button behavior:
   - If selection exists and contains highlights -> pressing highlight removes highlight in selection
   - Otherwise toggles pencil/highlighter typing mode (cursor change). While pencil mode active, mouse selection will result in highlight wrapping.
*/
btnHighlight.onclick = ()=>{
  const sel = window.getSelection();
  // If there is a selection and it intersects highlighted text, remove highlight from selection instead of toggling pencil mode
  if(sel && sel.rangeCount && !sel.getRangeAt(0).collapsed){
    const removed = toggleHighlightForSelectionRemoval();
    if(removed) {
      // ensure we are not in pencil mode after removal
      highlightActive = false;
      btnHighlight.classList.toggle('active', highlightActive);
      updateToolbarStates();
      return;
    }
  }
  // Otherwise toggle pencil mode
  highlightActive = !highlightActive;
  btnHighlight.classList.toggle('active', highlightActive);
  updateToolbarStates();
  // change cursor to pencil icon when active
  if(highlightActive){
    // set custom cursor (user will replace highlighter.png as needed)
    editor.style.cursor = "url('highlighter.png') 0 16, auto";
  } else {
    editor.style.cursor = '';
    // if turning off, ensure caret not inside highlight
    moveCaretOutOfHighlight();
  }
};

/* When the user mouseup-selects text while highlightActive, apply highlight */
editor.addEventListener('mouseup', (e)=>{
  if(highlightActive){
    const sel = window.getSelection();
    if(sel && sel.rangeCount && !sel.getRangeAt(0).collapsed){
      applyHighlightToSelection();
      // leave pencil active (user can continue selecting)
      // But ensure caret after selection is outside highlight to avoid accidental carriage of formatting
      moveCaretOutOfHighlight();
      updateToolbarStates();
      // clear selection to allow continued drawing (optional)
      // sel.removeAllRanges();
    }
  }
});

/* Also support keyboard-based selection (e.g., Shift+Arrow then press highlight button) - handled by btnHighlight onclick logic above */

/* ===== Prevent formatting on spaces for other formatting commands:
   On keydown, if user presses space while caret is inside a formatted span, we should insert a plain space and move caret outside formatting.
*/
editor.addEventListener('keydown', (e)=>{
  if(e.key === ' '){
    const sel = window.getSelection();
    if(sel && sel.rangeCount){
      const r = sel.getRangeAt(0);
      if(r.collapsed){
        // If caret is inside a highlighted span or styled span, we will insert a plain text space and move caret outside
        let anc = r.startContainer.nodeType === 3 ? r.startContainer.parentElement : r.startContainer;
        while(anc && anc !== editor){
          if(anc.classList && anc.classList.contains('hl')){
            e.preventDefault();
            // insert plain space after ancestor
            const spaceNode = document.createTextNode(' ');
            insertAfter(spaceNode, anc);
            // move caret after space
            const nr = document.createRange();
            nr.setStartAfter(spaceNode);
            nr.collapse(true);
            sel.removeAllRanges();
            sel.addRange(nr);
            // clean up zero-width if any
            cleanupZeroWidthSpacers();
            return;
          }
          // also check style color/font-family/font-size
          if(anc.style && (anc.style.color || anc.style.fontFamily || anc.style.fontSize)){
            e.preventDefault();
            const spaceNode = document.createTextNode(' ');
            // insert plain space after ancestor or split node accordingly
            insertAfter(spaceNode, anc);
            const nr = document.createRange();
            nr.setStartAfter(spaceNode);
            nr.collapse(true);
            sel.removeAllRanges();
            sel.addRange(nr);
            cleanupZeroWidthSpacers();
            return;
          }
          anc = anc.parentElement;
        }
      }
    }
  }
});

/* ===== Cursor cleanup when clicking away (remove pencil cursor globally if turned off) ===== */
document.addEventListener('click', (e)=>{
  if(!editor.contains(e.target) && highlightActive === false){
    editor.style.cursor = '';
  }
});

/* ===== Helper to check if selection is fully inside highlight (used for UI) ===== */
function selectionIsInsideHighlight(){
  const sel = window.getSelection();
  if(!sel || !sel.rangeCount) return false;
  const r = sel.getRangeAt(0);
  if(r.collapsed) return false;
  const startAnc = r.startContainer.nodeType === 3 ? r.startContainer.parentElement : r.startContainer;
  const endAnc = r.endContainer.nodeType === 3 ? r.endContainer.parentElement : r.endContainer;
  let sa = startAnc, ea = endAnc;
  while(sa && sa !== editor){
    if(sa.classList && sa.classList.contains('hl')) break;
    sa = sa.parentElement;
  }
  while(ea && ea !== editor){
    if(ea.classList && ea.classList.contains('hl')) break;
    ea = ea.parentElement;
  }
  return !!(sa || ea);
}

/* ===== Clear stray zero-width spacers on blur to keep content clean ===== */
editor.addEventListener('blur', ()=> setTimeout(cleanupZeroWidthSpacers, 200));

/* ===== Initial placeholder + toolbar state (unchanged) ===== */
ensurePlaceholder();
updateToolbarStates();

</script>
