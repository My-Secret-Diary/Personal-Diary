<style>

// palette (allow custom additions)

// helper to create color swatches including + custom
function createColorSwatches(){
  colorPopup.innerHTML = '';
  paletteColors.forEach((c, idx)=>{
    const s = document.createElement('div');
    s.className='sw';
    s.style.background = c;
    s.title = c;
    s.onclick = ()=>{
      currentColor = c;
      colorPreview.style.background = c;
      colorPreview.title = c;
      colorPopup.style.display = 'none';
      colorIcon.classList.add('active');
    };
    colorPopup.appendChild(s);
  });

  // add custom color "plus" square
  const add = document.createElement('div');
  add.className = 'sw';
  add.style.display = 'flex';
  add.style.alignItems = 'center';
  add.style.justifyContent = 'center';
  add.style.fontWeight = '700';
  add.style.cursor = 'pointer';
  add.textContent = '+';
  add.title = 'Add custom color';
  add.onclick = ()=>{
    const input = document.createElement('input');
    input.type = 'color';
    input.style.position = 'fixed';
    input.style.left = '-9999px';
    document.body.appendChild(input);
    input.click();
    input.onchange = ()=>{
      const c = input.value;
      if(c && !paletteColors.includes(c)){
        paletteColors.unshift(c);
      } else if(c){
        // move to front
        const i = paletteColors.indexOf(c);
        if(i>0){ paletteColors.splice(i,1); paletteColors.unshift(c); }
      }
      createColorSwatches();
      currentColor = c;
      colorPreview.style.background = c;
      colorPreview.title = c;
      document.body.removeChild(input);
    };
    // cleanup if user cancels (onblur)
    input.onblur = ()=> { if(document.body.contains(input)) document.body.removeChild(input); };
  };
  colorPopup.appendChild(add);
}

// timezone helper (India)
function getYMDInTimeZone(timeZone='Asia/Kolkata', d=new Date()){
  const parts = new Intl.DateTimeFormat('en-CA', { timeZone, year:'numeric', month:'2-digit', day:'2-digit' }).formatToParts(d);
  const obj = {}; parts.forEach(p=>obj[p.type]=p.value);
  return `${obj.year}-${obj.month}-${obj.day}`;
}
const toYMD = d => (new Date(d)).toISOString().slice(0,10);

// crypto helpers (PBKDF2 + AES-GCM)
function b64(arr){ return btoa(String.fromCharCode(...arr)); }
function fromB64(s){ return Uint8Array.from(atob(s), c=>c.charCodeAt(0)); }

async function deriveKey(password, salt) {
  const enc = new TextEncoder();
  const base = await crypto.subtle.importKey('raw', enc.encode(password), {name:'PBKDF2'}, false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name:'PBKDF2', salt, iterations:150000, hash:'SHA-256' }, base, { name:'AES-GCM', length:256 }, false, ['encrypt','decrypt']);
}
async function encryptPayload(password, payloadObj){
  const salt = crypto.getRandomValues(new Uint8Array(16));
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const key = await deriveKey(password, salt);
  const enc = new TextEncoder();
  const data = enc.encode(JSON.stringify(payloadObj));
  const cipher = await crypto.subtle.encrypt({ name:'AES-GCM', iv }, key, data);
  return { cipher: b64(new Uint8Array(cipher)), iv: b64(iv), salt: b64(salt) };
}
async function decryptPayload(password, docData){
  const iv = fromB64(docData.iv);
  const salt = fromB64(docData.salt);
  const key = await deriveKey(password, salt);
  const cipherBuf = fromB64(docData.cipher);
  const plain = await crypto.subtle.decrypt({ name:'AES-GCM', iv }, key, cipherBuf);
  return JSON.parse(new TextDecoder().decode(plain));
}

// SETTINGS LOADING
async function loadSettings(){
  try{
    const sRef = doc(db, 'entries', 'settings');
    const snap = await getDoc(sRef);
    if(snap.exists()){
      const data = snap.data();
      storedPassword = data.password || storedPassword;
      diaryName = data.name || diaryName;
      if(data.bg) settingsMeta.background = data.bg;
      diaryTitle.textContent = diaryName;
      applySettingsMeta();
    } else {
      // create default settings
      await setDoc(sRef, { password: storedPassword, name: diaryName, bg: settingsMeta.background || "" });
    }
  } catch(e){
    console.warn('loadSettings error', e);
  }
}

// calendar index for month
async function loadEntriesIndexForMonth(year, month){
  entriesIndex = {};
  const days = new Date(year, month+1, 0).getDate();
  const promises = [];
  for(let d=1; d<=days; d++){
    const key = toYMD(new Date(year, month, d));
    promises.push((async ()=>{
      try{
        const snap = await getDoc(doc(db,'entries', key));
        if(snap.exists()) entriesIndex[key] = true;
      }catch(e){}
    })());
  }
  await Promise.all(promises);
}

// render calendar
function renderCalendar(year, month){
  calendarYear = year; calendarMonth = month;
  const first = new Date(year, month, 1);
  const startWeekday = first.getDay();
  const daysInMonth = new Date(year, month+1, 0).getDate();
  monthLabel.textContent = first.toLocaleString(undefined,{month:'long', year:'numeric'});
  calendarGrid.innerHTML = '';
  for(let i=0;i<startWeekday;i++){ const el=document.createElement('div'); el.className='dayCell disabled'; calendarGrid.appendChild(el); }
  for(let d=1; d<=daysInMonth; d++){
    const dt = new Date(year, month, d);
    const key = toYMD(dt);
    const cell = document.createElement('div');
    cell.className='dayCell';
    cell.textContent = d;
    const dot = document.createElement('div'); dot.className='dot';
    if(entriesIndex[key]) cell.classList.add('hasEntry');
    cell.appendChild(dot);
    const todayKey = getYMDInTimeZone('Asia/Kolkata', new Date());
    if(key === todayKey) cell.classList.add('today');
    cell.onclick = async ()=> { await selectDate(key, dt); };
    if(key === selectedDate) cell.classList.add('selected');
    calendarGrid.appendChild(cell);
  }
}

// select date
async function selectDate(key, dt){
  selectedDate = key;
  selectedDateSpan.textContent = new Date(key).toLocaleDateString(undefined, { timeZone:'Asia/Kolkata' });
  calendarGrid.querySelectorAll('.dayCell').forEach(c=>c.classList.remove('selected'));
  calendarGrid.querySelectorAll('.dayCell').forEach(n=>{
    const txt = n.textContent && n.textContent.trim();
    if(txt && parseInt(txt,10) === dt.getDate()) n.classList.add('selected');
  });
  await loadEntryForDate(key);
  updateEditModeForDate(key);
}
function updateEditModeForDate(key){

// utility: insertAfter
function insertAfter(newNode, referenceNode){
  referenceNode.parentNode.insertBefore(newNode, referenceNode.nextSibling);
}

// Utility to wrap a Range's contents in an element (handles complex cases by using extractContents)
function wrapRangeWithElement(range, wrapperEl){
  try{
    const docFrag = range.extractContents();
    // remove nested wrappers of same type to avoid double-nesting if wrapperEl is highlight
    // but we will keep inner structure.
    wrapperEl.appendChild(docFrag);
    range.insertNode(wrapperEl);
    // adjust selection to be after wrapper
    const sel = window.getSelection();
    if(sel){
      sel.removeAllRanges();
      const newRange = document.createRange();
      newRange.setStartAfter(wrapperEl);
      newRange.collapse(true);
      sel.addRange(newRange);
    }
    return wrapperEl;
  } catch(e){
    // fallback: try surroundContents (may throw if range splits non-text nodes)
    try{
      range.surroundContents(wrapperEl);
      return wrapperEl;
    }catch(err){
      console.warn('wrapRange failed', err, e);
    }
  }
  return null;
}

// helpers to detect if element is highlight
function isHighlightEl(el){
  return el && el.nodeType===1 && (el.classList.contains('hl') || (el.style && (el.style.backgroundColor && el.style.backgroundColor.trim())));
}

// When highlight is turned off, make sure caret is not inside a highlighted span.
function moveCaretOutOfHighlight(){
  const sel = window.getSelection();
  if(!sel || !sel.rangeCount) return;
  const range = sel.getRangeAt(0);
  if(!range.collapsed) return; // only needed when caret collapsed
  let node = range.startContainer;
  let ancestor = (node.nodeType === 3) ? node.parentElement : node;
  while(ancestor && ancestor !== editor && ancestor.nodeType === 1){
    if(ancestor.classList && ancestor.classList.contains('hl') || (ancestor.style && ancestor.style.backgroundColor && ancestor.style.backgroundColor.trim())){
      const spacer = document.createElement('span');
      spacer.textContent = '\u200B';
      spacer.style.background = 'transparent';
      insertAfter(spacer, ancestor);
      const newRange = document.createRange();
      newRange.setStart(spacer.firstChild, 1);
      newRange.collapse(true);
      sel.removeAllRanges();
      sel.addRange(newRange);
      // cleanup as before
      setTimeout(()=> {
        try{
          const allSpacers = editor.querySelectorAll('span');
          allSpacers.forEach(s=>{
            if(s.textContent === '\u200B'){
              const sel2 = window.getSelection();
              if(sel2 && sel2.rangeCount){
                const r = sel2.getRangeAt(0);
                if(r.startContainer === s.firstChild) return;
              }
              s.remove();
            }
          });
        }catch(e){}
      }, 400);
      return;
    }
    ancestor = ancestor.parentElement;
  }
}

// HIGHLIGHT: wrap selection with <span class="hl" style="background:...">
function applyHighlightToSelection(range){
  if(!range || range.collapsed) return;
  // If selection already contains exact whole hl spans, we might be duplicating - but we'll still wrap.
  const wrapper = document.createElement('span');
  wrapper.className = 'hl';
  wrapper.style.background = highlightColor;
  wrapRangeWithElement(range, wrapper);
}

// Remove highlight from only selected part
function removeHighlightFromSelection(range){
  if(!range || range.collapsed) return;
  // We'll get the fragment, search for hl spans and strip them (unwrap their children),
  // then replace the selection with processed fragment.
  const frag = range.cloneContents();
  // process frag: unwrap .hl elements and remove background style on spans
  const walker = document.createTreeWalker(frag, NodeFilter.SHOW_ELEMENT, null, false);
  const toUnwrap = [];
  while(walker.nextNode()){
    const el = walker.currentNode;
    if(el.classList && el.classList.contains('hl')){
      toUnwrap.push(el);
    } else if(el.tagName === 'SPAN' && el.style && el.style.backgroundColor){
      // remove background style
      el.style.backgroundColor = '';
      // if no other styles/attributes, mark for unwrap
      if(!el.getAttributeNames().some(a=>a!=='style') && el.style.cssText.trim()==='') toUnwrap.push(el);
    }
  }
  toUnwrap.forEach(el=>{
    // replace el with its children
    while(el.firstChild) el.parentNode.insertBefore(el.firstChild, el);
    el.parentNode.removeChild(el);
  });
  // replace range contents with processed frag
  range.deleteContents();
  range.insertNode(frag);
}

      })();

    }

// Mouse handling for click-drag highlight inside editor
editor.addEventListener('mousedown', (e)=>{
  if(!highlightActive) return;
  highlightMouseDown = true;
  const sel = window.getSelection();
  sel.removeAllRanges();
  // create a new range starting at caret position where mouse down occurred
  const range = document.caretRangeFromPoint ? document.caretRangeFromPoint(e.clientX, e.clientY) : document.caretPositionFromPoint ? (function(pos){ const pr = document.caretPositionFromPoint(pos.clientX,pos.clientY); const r = document.createRange(); r.setStart(pr.offsetNode, pr.offset); return r; })(e) : null;
  if(range) highlightStartRange = range.cloneRange();
  e.preventDefault();
});

document.addEventListener('mousemove', (e)=>{
  if(!highlightActive || !highlightMouseDown || !highlightStartRange) return;
  // Extend selection to current mouse position
  const endRange = document.caretRangeFromPoint ? document.caretRangeFromPoint(e.clientX, e.clientY) : null;
  if(!endRange) return;
  const sel = window.getSelection();
  sel.removeAllRanges();
  const r = document.createRange();
  try{
    r.setStart(highlightStartRange.startContainer, highlightStartRange.startOffset);
    r.setEnd(endRange.startContainer, endRange.startOffset);
    sel.addRange(r);
  }catch(err){}
});

document.addEventListener('mouseup', (e)=>{
  if(!highlightActive) return;
  if(highlightMouseDown){
    highlightMouseDown = false;
    // finalize selection and wrap
    const sel = window.getSelection();
    if(sel && sel.rangeCount && !sel.getRangeAt(0).collapsed){
      const r = sel.getRangeAt(0).cloneRange();
      // If selection already has hl elements -> remove hl from selection; else apply hl
      const frag = r.cloneContents();
      const hasHL = !!frag.querySelector && !!frag.querySelector('.hl');
      if(hasHL){
        removeHighlightFromSelection(r);
      } else {
        applyHighlightToSelection(r);
      }
      sel.removeAllRanges();
      // place caret after the applied highlight for predictable typing
      const newRange = document.createRange();
      // find node after the applied highlight if possible
      try{
        // Attempt to set caret after last node in applied region
        newRange.setStartAfter(r.endContainer);
      }catch(e){
        newRange.setStart(editor, editor.childNodes.length);
      }
      newRange.collapse(true);
      sel.addRange(newRange);
    }
    highlightStartRange = null;
    updateToolbarStates();
  }
});

// beforeinput intercept so typing applies currentColor/highlight/typingFont/typingSize when caret collapsed
editor.addEventListener('beforeinput', (e)=>{
  if(e.inputType === 'insertText' && e.data !== null){
    const sel = window.getSelection();
    if(!sel.rangeCount) return;
    const range = sel.getRangeAt(0);
    if(!range.collapsed){
      // Non-collapsed insertion (replacing selected text) - we will let default or handle as styled replacement below
      // We'll fall back to manual replace to preserve formatting rules
      e.preventDefault();
      // create node to insert
      const text = e.data;
      let nodeToInsert;
      if(text === ' '){
        nodeToInsert = document.createTextNode(' ');
      } else {
        // create span only if styling requested
        if(currentColor || highlightActive || typingFont || typingSize){
          nodeToInsert = document.createElement('span');
          if(currentColor) nodeToInsert.style.color = currentColor;
          if(highlightActive) nodeToInsert.style.backgroundColor = highlightColor;
          if(typingFont) nodeToInsert.style.fontFamily = typingFont;
          if(typingSize) nodeToInsert.style.fontSize = typingSize;
          nodeToInsert.textContent = text;
        } else {
          nodeToInsert = document.createTextNode(text);
        }
      }
      range.deleteContents();
      range.insertNode(nodeToInsert);
      // move caret after node
      const newR = document.createRange();
      if(nodeToInsert.nodeType === 3){
        newR.setStart(nodeToInsert, nodeToInsert.length);
      } else {
        newR.setStartAfter(nodeToInsert);
      }
      newR.collapse(true);
      sel.removeAllRanges();
      sel.addRange(newR);
      updateToolbarStates();
      return;
    }

    // collapsed caret insertion
    // If user typed a space and currently formatting is active -> insert plain space and move caret outside formatting
    if(e.data === ' '){
      e.preventDefault();
      // insert plain space text node at caret
      const textNode = document.createTextNode(' ');
      range.insertNode(textNode);
      // move caret after space
      range.setStartAfter(textNode);
      range.collapse(true);
      sel.removeAllRanges();
      sel.addRange(range);
      // ensure caret is not inside a highlighted/span by moving it out
      moveCaretOutOfHighlight();
      updateToolbarStates();
      return;
    }

    // For normal characters (non-space)
    if(!currentColor && !highlightActive && !typingFont && !typingSize){
      // nothing special; allow browser to insert normally
      return;
    }

    // Otherwise intercept and insert a styled span for this character (keeps past text unmodified)
    e.preventDefault();
    const span = document.createElement('span');
    if(currentColor) span.style.color = currentColor;
    if(highlightActive) span.style.backgroundColor = highlightColor;
    if(typingFont) span.style.fontFamily = typingFont;
    if(typingSize) span.style.fontSize = typingSize;
    span.textContent = e.data;
    range.insertNode(span);
    // move caret after span
    range.setStartAfter(span);
    range.collapse(true);
    sel.removeAllRanges();
    sel.addRange(range);
    updateToolbarStates();
  }
});

// cleanup helper: remove stray zero-width space nodes that may remain (keeps caret integrity)
function cleanupZeroWidthSpacers(){
  try{
    const nodes = editor.querySelectorAll('span');
    nodes.forEach(s=>{
      if(s.textContent === '\u200B'){
        const sel = window.getSelection();
        let keep = false;
        if(sel && sel.rangeCount){
          const r = sel.getRangeAt(0);
          if(r.startContainer === s.firstChild) keep = true;
        }
        if(!keep) s.remove();
      }
    });
  }catch(e){}
}

// encryption wrappers for entries
async function encryptEntry(password, payload){ return await encryptPayload(password, payload); }
async function decryptEntry(password, docData){ return await decryptPayload(password, docData); }

// load entry
async function loadEntryForDate(key){
  try{
    currentPageBackground = null;
    const snap = await getDoc(doc(db,'entries', key));
    if(!snap.exists()){
      editor.innerHTML = '<div class="placeholder" style="color:var(--muted)">Start writing your thoughts...</div>';
      ensurePlaceholder();
      // reset page background for this date
      applyPageBackground(null);
      return;
    }
    const data = snap.data();
    if(data.cipher && data.iv && data.salt){
      try{
        const payload = await decryptEntry(currentPassword, data);
        editor.innerHTML = payload.html || '';
        settingsMeta = payload.meta || settingsMeta;
        diaryName = payload.diaryName || diaryName;
        diaryTitle.textContent = diaryName;
        // load per-page background if present
        currentPageBackground = payload.pageBackground || null;
        applyPageBackground(currentPageBackground);
        applySettingsMeta(); // still apply general UI settings
      } catch(e){
        editor.innerHTML = '<div class="placeholder" style="color:var(--muted)">Unable to decrypt this entry (wrong password).</div>';
      }
    } else if(data.text){
      editor.innerHTML = data.text || '';
      applyPageBackground(null);
    } else {
      editor.innerHTML = '<div class="placeholder" style="color:var(--muted)">Empty</div>';
      applyPageBackground(null);
    }
  } catch(e){ console.error('loadEntryForDate', e) }
}

function applyPageBackground(imgData){
  if(imgData){
    editorWrap.style.backgroundImage = `url("${imgData}")`;
    editorWrap.style.backgroundSize = 'cover';
    editorWrap.style.backgroundPosition = 'center';
  } else {
    editorWrap.style.backgroundImage = '';
  }
}

// save entry (encrypted)
async function saveEntryForDate(key){
  const dd = new Date(key + 'T00:00:00');
  const todayStr = getYMDInTimeZone('Asia/Kolkata', new Date());
  const today = new Date(todayStr + 'T00:00:00');
  if(dd > today) { showToast('Cannot save future entries', false); return false; }
  ensurePlaceholder();
  const html = editor.innerHTML;
  const payload = { html, meta: settingsMeta, diaryName, pageBackground: currentPageBackground || null, savedAt: new Date().toISOString() };
  try{
    const enc = await encryptEntry(currentPassword, payload);
    await setDoc(doc(db,'entries', key), { ...enc, savedAt: serverTimestamp() });
    entriesIndex[key] = true;
    await loadEntriesIndexForMonth(calendarYear, calendarMonth);
    renderCalendar(calendarYear, calendarMonth);
    showToast('Saved', true);
    return true;
  } catch(e){
    console.error('saveEntryForDate', e);
    showToast('Save failed', false);
    return false;
  }
}

  if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='b'){ e.preventDefault(); execCmd('bold'); }
  if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='i'){ e.preventDefault(); execCmd('italic'); }
  if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='u'){ e.preventDefault(); execCmd('underline'); }
});

// initial placeholder + toolbar state
ensurePlaceholder();
updateToolbarStates();

/* ---------------------------
   CLEAR FORMATTING IMPLEMENTATION
   - Removes bold/italic/underline/strike/color/highlight/font-family/font-size
   - Does not remove text or convert lists to plain text
   --------------------------- */
function cleanFragmentStyles(frag){
  // This function will traverse the fragment and:
  // - unwrap inline semantic tags (B, STRONG, I, EM, U, S, STRIKE)
  // - remove style properties color, background-color, font-family, font-size from spans & elements
  // - unwrap hl spans
  const walker = document.createTreeWalker(frag, NodeFilter.SHOW_ELEMENT, null, false);
  const toProcess = [];
  while(walker.nextNode()){
    toProcess.push(walker.currentNode);
  }
  toProcess.forEach(el=>{
    const tag = el.tagName;
    if(tag === 'B' || tag === 'STRONG' || tag === 'I' || tag === 'EM' || tag === 'U' || tag === 'S' || tag === 'STRIKE'){
      // unwrap but keep children
      while(el.firstChild) el.parentNode.insertBefore(el.firstChild, el);
      el.parentNode.removeChild(el);
      return;
    }
    if(el.classList && el.classList.contains('hl')){
      // unwrap highlight span: keep children
      while(el.firstChild) el.parentNode.insertBefore(el.firstChild, el);
      el.parentNode.removeChild(el);
      return;
    }
    // For spans and other inline elements, remove style properties that apply to formatting
    if(el.style){
      el.style.removeProperty('font-weight');
      el.style.removeProperty('font-style');
      el.style.removeProperty('text-decoration');
      el.style.removeProperty('text-decoration-line');
      el.style.removeProperty('color');
      el.style.removeProperty('background-color');
      el.style.removeProperty('background');
      el.style.removeProperty('font-family');
      el.style.removeProperty('font-size');
      // If no attributes and no inline styles left, unwrap the span to keep DOM clean
      const attrs = el.getAttributeNames().filter(a=>a!=='style');
      if(el.tagName === 'SPAN' && attrs.length === 0 && (!el.getAttribute('style') || el.style.cssText.trim()==='')){
        while(el.firstChild) el.parentNode.insertBefore(el.firstChild, el);
        el.parentNode.removeChild(el);
      }
    }
  });
}

clearFmt.onclick = ()=>{
  const sel = window.getSelection();
  if(sel && sel.rangeCount && !sel.getRangeAt(0).collapsed){
    const range = sel.getRangeAt(0).cloneRange();
    const frag = range.cloneContents();
    cleanFragmentStyles(frag);
    // replace selection with cleaned fragment
    range.deleteContents();
    range.insertNode(frag);
    // collapse selection after inserted content
    sel.removeAllRanges();
    const newR = document.createRange();
    // place caret at end of inserted content
    if(range.startContainer && range.startContainer.nodeType === 3){
      newR.setStart(range.startContainer, Math.min(range.startOffset, (range.startContainer.length||0)));
    } else {
      newR.setStartAfter(range.startContainer);
    }
    newR.collapse(true);
    sel.addRange(newR);
  } else {
    // no selection: clean entire editor content but preserve lists & block structure
    const container = document.createElement('div');
    // clone children to container
    Array.from(editor.childNodes).forEach(n=> container.appendChild(n.cloneNode(true)));
    cleanFragmentStyles(container);
    editor.innerHTML = '';
    // append cleaned nodes back
    while(container.firstChild) editor.appendChild(container.firstChild);
    ensurePlaceholder();
  }
  updateToolbarStates();
};

/* ---------------------------
   Simple format buttons that rely on execCommand for bold/italic/underline/list/align.
   We'll keep them as before but the clear formatting handles spans and inline styles thoroughly.
   --------------------------- */
btnBold.onclick = ()=> execCmd('bold');
btnItalic.onclick = ()=> execCmd('italic');
btnUnderline.onclick = ()=> execCmd('underline');
btnStrike.onclick = ()=> execCmd('strikeThrough');

btnBullet.onclick = ()=> execCmd('insertUnorderedList');
btnNumber.onclick = ()=> execCmd('insertOrderedList');

alignLeft.onclick = ()=> execCmd('justifyLeft');
alignCenter.onclick = ()=> execCmd('justifyCenter');
alignRight.onclick = ()=> execCmd('justifyRight');

/* ---------------------------
   Additional helper: remove highlight spans when user selects highlighted area and toggles highlight (handled earlier)
   --------------------------- */

// Ensure that changes which affect selection states update toolbar
editor.addEventListener('selectionchange', updateToolbarStates);

</script>
